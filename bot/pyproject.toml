[project]
name = "modus-bot"
version = "0.1.0"
description = "Telegram-бот системы обращений и предложений сотрудников «Модус Трейд»"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
