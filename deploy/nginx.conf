# Статика веба и Mini App. Все неизвестные пути отдают index.html (маршруты React).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
