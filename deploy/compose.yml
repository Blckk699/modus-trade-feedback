# Продовое развёртывание на сервере systm (каталог /opt/modus). Запускает deploy/deploy.sh, руками не нужно.
#   /opt/modus/src          — код из main (git archive)
#   /opt/modus/.env         — POSTGRES_PASSWORD (создаётся при первой выкладке)
#   /opt/modus/secrets.env  — ключи: ANTHROPIC_API_KEY, ELEVENLABS_API_KEY, TELEGRAM_BOT_TOKEN, BOT_SERVICE_KEY, BITRIX24_*
#   /opt/modus/seed/        — seed-accounts.json с реальными Telegram ID ролей демо
#   /opt/modus/web-dist/    — собранный веб
# Наружу смотрит только общий Caddy (сеть qazmap_default): /api/* → modus-api:8000, остальное → modus-web:80.
name: modus

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modus
      POSTGRES_DB: modus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD в /opt/modus/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modus -d modus"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m

  api:
    build: ./src/backend
    env_file: [secrets.env]
    environment:
      DATABASE_URL: postgresql://modus:${POSTGRES_PASSWORD}@db:5432/modus
      DEV_LOGIN_ENABLED: "false"
      # Caddy ходит к API из сети qazmap_default — доверяем X-Forwarded-For только от неё.
      TRUSTED_PROXIES: 127.0.0.1,::1,172.18.0.0/16
      SEED_ACCOUNTS_FILE: /run/modus/seed-accounts.json
    volumes:
      - ./seed:/run/modus:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"   # для проверок с самого сервера
    networks:
      default: {}
      qazmap:
        aliases: [modus-api]
    restart: unless-stopped
    mem_limit: 768m

  bot:
    build: ./src/bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_SERVICE_KEY: ${BOT_SERVICE_KEY:-}
      API_BASE_URL: http://api:8000
      MINI_APP_URL: https://modus.systm.kz
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 256m

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./src/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18080:80"     # для проверок с самого сервера
    networks:
      default: {}
      qazmap:
        aliases: [modus-web]
    restart: unless-stopped
    mem_limit: 64m

volumes:
  pgdata:

networks:
  qazmap:
    name: qazmap_default
    external: true
