    post:
      tags: [access]
      summary: Одобрить заявку — создаёт пользователя
      description: |
        Администратор и собственник. Роль по умолчанию `employee`, `owner` не выдаётся (`422`).
        Подразделение по умолчанию — выбранное в заявке. Заявителю уходит уведомление `access_request_approved`.
