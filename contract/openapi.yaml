        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    BotNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          required: [recipient, attempts]
          properties:
            recipient:
              type: object
              required: [user_id, telegram_id]
              properties:
                user_id:
                  type: integer
                telegram_id:
                  type: integer
                  format: int64
            attempts:
              type: integer
              description: Сколько раз бот уже пытался доставить
    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    MarkReadRequest:
      type: object
      properties:
        all:
          type: boolean
        appeal_id:
          type: integer
        ids:
          type: array
          items:
            type: integer

