  # ---------------------------------------------------------------- admin
  /api/v1/admin/users:
    post:
      tags: [admin]
      summary: Добавить сотрудника по Telegram ID или почте
      description: |
        Нужен хотя бы один способ входа: `telegram_id` или `email`. Пароль сотруднику с почтой выдаётся
        сбросом (`POST /admin/users/{id}/reset-password`). Только администратор, остальным — `403`.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              telegram_id: 100000017
              full_name: Ирина Волкова
              position: Специалист по закупкам
              role: employee
              department_id: 1
      responses:
        '201':
          description: Сотрудник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 17
                telegram_id: 100000017
                full_name: Ирина Волкова
                position: Специалист по закупкам
                role: employee
                department: {id: 1, name: Закупки}
                is_absent: false
                is_disabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Изменить роль, подразделение, отсутствие, доступ
      description: |
        `is_absent=true` — новые обращения его категорий получает заместитель.
        `is_disabled=true` — вход запрещён, текущие сессии сбрасываются.
        Только администратор, остальным — `403`.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              is_absent: true
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3
                telegram_id: 100000003
                full_name: Марат Сейткали
                position: Руководитель закупок
                role: head
                department: {id: 1, name: Закупки}
                is_absent: true
                is_disabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/users/{user_id}/reset-password:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [admin]
      summary: Сбросить пароль сотруднику
      description: |
        Возвращает временный пароль один раз, в базе — только хеш. При входе с ним сотрудник задаёт новый
        (`403 password_change_required`). Блокировка после неудачных попыток снимается.
        У сотрудника без почты — `409 conflict`. Только администратор, остальным — `403`.
      operationId: adminResetPassword
      responses:
        '200':
          description: Временный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
              example:
                temporary_password: Tmp-7kQ2-xZ9p
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/departments:
    post:
      tags: [admin]
      summary: Добавить подразделение
      description: Только администратор, остальным — `403`.
      operationId: adminCreateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentWrite'
            example:
              name: Логистика
