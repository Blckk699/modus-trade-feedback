  /api/v1/appeals/{appeal_id}/merge:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions, duplicates]
      summary: Присоединить это обращение как повтор к основному
      description: |
        `appeal_id` — повтор, `main_appeal_id` — основное. Оба в статусах «Новое» или «На рассмотрении»
        и оба видны пользователю, иначе `409 merge_not_allowed` / `403`. Повтор между зонами разных
        ответственных склеивает руководитель или собственник. Повтор переходит в «Закрыто» со ссылкой
        на основное, его автор становится участником основного и получает его статусы.
        Ответ — основное обращение с обновлённым `participants_count`.
        Кто: ответственный (оба обращения назначены ему), руководитель, собственник. Администратору — `403`, даже если он видит оба обращения.
      operationId: mergeAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [main_appeal_id]
              properties:
                main_appeal_id:
                  type: integer
            example:
              main_appeal_id: 3
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealMergedMain:
                  $ref: '#/components/examples/AppealMergedMain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Склейка невозможна (`merge_not_allowed`) или недопустимый статус (`invalid_transition`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: merge_not_allowed
                  message: Склеить можно только обращения в статусах «Новое» и «На рассмотрении».
                  details: {appeal_status: in_progress, main_appeal_status: in_review}

