      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealInWork:
                  $ref: '#/components/examples/AppealInWork'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}/reject:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Отклонить с обязательной причиной (На рассмотрении → Отклонено)
      description: 'Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.'
