                AppealA017Rejected:
                  $ref: '#/components/examples/AppealA017Rejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}/implement:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Зафиксировать результат (В работе → Реализовано)
      description: |
        Обращение попадает в ленту реализованного, которую видят все сотрудники. В ленте показываются
        «что предложили» и «что сделали»:
        - что предложили — `public_summary`; если не задан — публичная формулировка обсуждения, а без обсуждения — краткая суть;
        - что сделали — `public_result`; если не задан — `result`. Поэтому `result` без `public_result` пишите так,
          чтобы его можно было показать всем.
        Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.
      operationId: implementAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  minLength: 1
                public_summary:
                  type: string
                  nullable: true
                  description: Что предложили — для ленты
                public_result:
                  type: string
                  nullable: true
                  description: Что сделали — публичная формулировка для ленты
            example:
              result: Запланирован пробный обучающий семинар по новым товарным линейкам на 20 ноября.
              public_summary: Короткие занятия по новым товарным линейкам
              public_result: Проведём пробный семинар по новым товарным линейкам
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealA004Implemented:
                  $ref: '#/components/examples/AppealA004Implemented'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}/accept-feedback:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Принять положительный отзыв одним действием (Новое → Закрыто)
      description: |
        Только для `type=praise`. Для других типов — `409 invalid_transition`.
        Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.
      operationId: acceptFeedback
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  nullable: true
            example:
              comment: Спасибо! Передали организаторам обучения.
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealFeedbackAccepted:
                  $ref: '#/components/examples/AppealFeedbackAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/v1/appeals/{appeal_id}/reassign:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Назначить или переназначить ответственного
      description: |
        Руководитель (в своём подразделении), администратор, собственник. Если первого ответа ещё не было,
        срок первого ответа отсчитывается заново; у отвеченного обращения срок не меняется.
        Назначить можно действующего сотрудника, кроме администратора (`422`). Этим же маршрутом администратор
        назначает ответственного из очереди нераспределённых.

        Причина (`reason`):
        - у обращения уже есть ответственный (смена) — обязательна: без неё, с `null` или из одних пробелов —
          `422` с полем `reason`. В историю пишется событие `reassigned`, причина — в `comment`;
        - ответственного нет (первое назначение) — необязательна: поле можно не передавать или передать `null`.
          В историю пишется событие `assigned`; `comment` — причина, если её передали, иначе `null`
          (стандартный текст сервер не подставляет).
        Ответственному, сотруднику — `403`.
      operationId: reassignAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id]
              properties:
                assignee_id:
                  type: integer
                reason:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: Обязательна, если у обращения уже есть ответственный
            examples:
              reassign:
                summary: Смена ответственного — с причиной
                value:
                  assignee_id: 13
                  reason: Вопрос про синхронизацию систем — в зоне IT.
              first_assignment:
                summary: Первое назначение из очереди «Без ответственного» — причина не нужна
                value:
                  assignee_id: 7
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealReassigned:
                  $ref: '#/components/examples/AppealReassigned'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}/merge:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions, duplicates]
      summary: Присоединить это обращение как повтор к основному
      description: |
        `appeal_id` — повтор, `main_appeal_id` — основное. Повтор — в статусе «Новое» или «На рассмотрении».
        Основное — любое незавершённое: «Новое», «На рассмотрении», «Ожидает уточнения», «В работе».
        Оба видны пользователю. Иначе `409 merge_not_allowed` / `403`; причина отказа — в `details.reason`
        и в `message`, его можно показать пользователю:
        `duplicate_status` — повтор уже разбирают или он завершён, `main_finished` — основное завершено,
        `praise` — положительный отзыв не склеивается, `same_appeal` — обращение присоединяют к самому себе.
        Повтор между зонами разных
        ответственных склеивает руководитель или собственник. Повтор переходит в «Закрыто» со ссылкой
        на основное, его автор становится участником основного и получает его статусы.
        Ответ — основное обращение с обновлённым `participants_count`.
        Кто: ответственный (оба обращения назначены ему), руководитель, собственник. Администратору — `403`, даже если он видит оба обращения.
      operationId: mergeAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [main_appeal_id]
              properties:
                main_appeal_id:
                  type: integer
            example:
              main_appeal_id: 3
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealMergedMain:
                  $ref: '#/components/examples/AppealMergedMain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Склейка невозможна (`merge_not_allowed`) или недопустимый статус (`invalid_transition`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: merge_not_allowed
                  message: Присоединить как повтор можно только обращение в статусах «Новое» и «На рассмотрении»
                  details: {reason: duplicate_status, appeal_status: in_progress, main_appeal_status: in_review}

  # ---------------------------------------------------------------- messages
  /api/v1/appeals/{appeal_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    get:
      tags: [messages]
      summary: Приватная переписка по обращению
      description: Видят автор, ответственный, руководитель подразделения и собственник. Администратор и участники склеенных повторов — `403`.
      operationId: listMessages
      responses:
        '200':
          description: Сообщения по возрастанию времени
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
                - id: 501
                  appeal_id: 5
                  author: {id: 5, full_name: Ольга Петрова, role: head, department: {id: 2, name: Бухгалтерия}}
                  text: Уточните, пожалуйста, какие виды документов чаще всего «теряются» между подразделениями?
                  is_clarification_question: true
                  created_at: '2026-11-09T12:40:00+05:00'
                - id: 502
                  appeal_id: 5
                  author: {id: 6, full_name: Дина Жуматова, role: employee, department: {id: 2, name: Бухгалтерия}}
                  text: Чаще всего акты сверки и счета-фактуры от поставщиков.
                  is_clarification_question: false
                  created_at: '2026-11-10T09:05:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [messages]
      summary: Написать в приватную переписку
      description: |
        Если обращение в «Ожидает уточнения» и пишет автор, сообщение считается ответом на вопрос
        и возвращает обращение в «На рассмотрении» (действие `reply_clarification`).
        Бот отправляет ответ автора этим же маршрутом от имени пользователя.
      operationId: postMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
            example:
              text: Чаще всего акты сверки и счета-фактуры от поставщиков.
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 502
                appeal_id: 5
                author: {id: 6, full_name: Дина Жуматова, role: employee, department: {id: 2, name: Бухгалтерия}}
                text: Чаще всего акты сверки и счета-фактуры от поставщиков.
                is_clarification_question: false
                created_at: '2026-11-10T09:05:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

