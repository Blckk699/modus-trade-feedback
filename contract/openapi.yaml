      summary: Текст сводки для бота
      description: |
        Команда сводки в боте: бот вызывает от имени пользователя и отправляет `text` как есть (Telegram HTML).
        Руководитель получает своё подразделение, собственник — компанию. Остальным — `403`.
        Утренняя сводка приходит в очередь уведомлений (`kind=digest`) сама.
      operationId: getDigest
      responses:
        '200':
          description: Текст сводки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Digest'
              example:
                scope: company
                department: null
                generated_at: '2026-11-10T09:00:00+05:00'
                text: "<b>Сводка на 10 ноября</b>\n\n🆕 Новое за сутки: 3\n• A-021 Нет назначения изделия в заявках (Закупки)\n\n⏰ Зависло: 2\n• A-007 — Даурен Исаев, просрочено 2 дн.\n• A-011 — Тимур Абенов, просрочено 1 дн.\n\n✅ Закрыто за неделю: 4\n\n🔁 Повторяется: A-003 — сообщили 3 человека"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- notifications
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Уведомления пользователя
      operationId: listNotifications
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Новые сверху
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                  - {"id": 901, "kind": "status_changed", "text": "Обращение <b>A-017</b> отклонено.\nПричина: сейчас нет подходящего помещения; вернёмся к вопросу при перепланировке офиса.", "appeal": {"id": 17, "number": "A-017", "summary": "Зона для коротких перерывов рядом с рабочими помещениями", "status": "rejected", "type": "suggestion"}, "path": "/appeals/17", "buttons": [{"type": "open_appeal", "text": "Открыть обращение", "appeal_id": 17, "discussion_id": null}], "is_read": false, "created_at": "2026-10-29T16:00:00+05:00"}
                total: 1
                page: 1
                page_size: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Счётчик непрочитанного
      operationId: getUnreadCount
      responses:
        '200':
          description: Счётчик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
              example:
                count: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Отметить прочитанным
      description: |
        `all=true` — всё; `appeal_id` — всё по обращению (клиент вызывает при открытии карточки);
        `ids` — конкретные. Возвращает новый счётчик.
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
            example:
              appeal_id: 21
      responses:
        '200':
          description: Счётчик после отметки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
              example:
                count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- bot
  /api/v1/bot/notifications/pending:
    get:
      tags: [bot]
      summary: Неотправленные уведомления для доставки в Telegram
      description: |
        Бот опрашивает раз в несколько секунд. Возвращаются уведомления без подтверждённой доставки,
        у которых наступило время следующей попытки. Подтверждённое (`ack`) больше не возвращается.
      operationId: listPendingNotifications
      security:
        - serviceKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Уведомления к отправке, старые первыми
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotNotification'
              example:
                - {"id": 905, "kind": "clarification_requested", "text": "По обращению <b>A-005</b> вопрос от ответственного:\nУточните, пожалуйста, какие виды документов чаще всего «теряются» между подразделениями?", "appeal": {"id": 5, "number": "A-005", "summary": "Не видно, на каком этапе пакет документов", "status": "awaiting_info", "type": "problem"}, "path": "/appeals/5", "buttons": [{"type": "reply_clarification", "text": "Ответить", "appeal_id": 5, "discussion_id": null}, {"type": "open_appeal", "text": "Открыть обращение", "appeal_id": 5, "discussion_id": null}], "is_read": false, "created_at": "2026-11-09T12:40:00+05:00", "recipient": {"user_id": 6, "telegram_id": 100000006}, "attempts": 0}
                - {"id": 906, "kind": "name_consent_request", "text": "Ваше обращение <b>A-020</b> вынесено на общее обсуждение.\nПоказывать ваше имя? Без согласия будет указано только подразделение.", "appeal": {"id": 20, "number": "A-020", "summary": "Публиковать обзор завершённых внутренних улучшений", "status": "in_review", "type": "suggestion"}, "path": "/discussions/12", "buttons": [{"type": "name_consent_show", "text": "Показать имя", "appeal_id": 20, "discussion_id": 12}, {"type": "name_consent_hide", "text": "Скрыть", "appeal_id": 20, "discussion_id": 12}], "is_read": false, "created_at": "2026-11-10T13:00:00+05:00", "recipient": {"user_id": 4, "telegram_id": 100000004}, "attempts": 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/bot/notifications/{notification_id}/ack:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [bot]
      summary: Подтвердить доставку
      operationId: ackNotification
      security:
        - serviceKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_message_id:
                  type: integer
                  nullable: true
                  description: ID отправленного сообщения — бот по нему узнаёт, на какой вопрос ответил пользователь (reply)
      responses:
        '204':
          description: Доставка подтверждена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/bot/notifications/{notification_id}/fail:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [bot]
      summary: Сообщить о неудачной доставке
      description: Уведомление вернётся в `pending` позже с нарастающей паузой. Пользователь заблокировал бота — `permanent=true`.
      operationId: failNotification
      security:
        - serviceKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                permanent:
                  type: boolean
                  default: false
      responses:
        '204':
          description: Попытка учтена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- directories
  /api/v1/departments:
    get:
      tags: [dictionaries]
      summary: Подразделения
      operationId: listDepartments
      responses:
        '200':
          description: Подразделения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
              examples:
                DepartmentsExample:
                  $ref: '#/components/examples/DepartmentsExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/categories:
    get:
      tags: [dictionaries]
      summary: Категории с ответственными
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      operationId: listCategories
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              examples:
                CategoriesExample:
                  $ref: '#/components/examples/CategoriesExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [dictionaries]
      summary: Справочник сотрудников
      description: |
        Для выбора ответственного при переназначении и автора черновика совещания.
        `telegram_id` отдаётся только администратору, остальным — null.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: department_id
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: include_disabled
          in: query
          description: Только для администратора
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              examples:
                UsersExample:
                  $ref: '#/components/examples/UsersExample'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- admin
  /api/v1/admin/users:
    post:
      tags: [admin]
      summary: Добавить сотрудника по Telegram ID
      description: Только администратор, остальным — `403`.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              telegram_id: 100000017
              full_name: Ирина Волкова
              position: Специалист по закупкам
              role: employee
              department_id: 1
      responses:
        '201':
          description: Сотрудник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 17
                telegram_id: 100000017
                full_name: Ирина Волкова
                position: Специалист по закупкам
                role: employee
                department: {id: 1, name: Закупки}
                is_absent: false
                is_disabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Изменить роль, подразделение, отсутствие, доступ
      description: |
        `is_absent=true` — новые обращения его категорий получает заместитель.
        `is_disabled=true` — вход запрещён, текущие сессии сбрасываются.
        Только администратор, остальным — `403`.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              is_absent: true
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3
                telegram_id: 100000003
                full_name: Марат Сейткали
                position: Руководитель закупок
                role: head
                department: {id: 1, name: Закупки}
                is_absent: true
                is_disabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/departments:
    post:
      tags: [admin]
      summary: Добавить подразделение
      description: Только администратор, остальным — `403`.
      operationId: adminCreateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentWrite'
            example:
              name: Логистика
              head_id: null
      responses:
        '201':
          description: Подразделение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              example:
                id: 9
                name: Логистика
                head: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/departments/{department_id}:
    parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Изменить название или руководителя подразделения
      description: Только администратор, остальным — `403`.
      operationId: adminUpdateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
            example:
              head_id: 3
      responses:
        '200':
          description: Подразделение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              example:
                id: 1
                name: Закупки
                head: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/categories:
    post:
      tags: [admin]
      summary: Добавить категорию
      description: Только администратор, остальным — `403`.
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
            example:
              name: Склад и логистика
              department_id: 1
              responsible_id: 3
              deputy_id: 4
      responses:
        '201':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 19
                name: Склад и логистика
                department: {id: 1, name: Закупки}
                responsible: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                deputy: {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: 'Изменить категорию: ответственный, заместитель, подразделение, активность'
      description: |
        Изменение влияет на маршрутизацию новых обращений; уже назначенные не переназначаются.
        Только администратор, остальным — `403`.
      operationId: adminUpdateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              responsible_id: 13
              deputy_id: null
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 7
                name: Интеграции и IT
                department: {id: 6, name: IT}
                responsible: {id: 13, full_name: Даурен Исаев, role: employee, department: {id: 6, name: IT}}
                deputy: null
                is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/deadline-rules:
    get:
      tags: [admin]
      summary: Сроки первого ответа по приоритетам
      description: Только администратор, остальным — `403`.
      operationId: adminGetDeadlineRules
      responses:
        '200':
          description: Правила
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadlineRule'
              example:
                - {priority: high, business_days: 1}
                - {priority: medium, business_days: 3}
                - {priority: low, business_days: 5}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      summary: Изменить сроки первого ответа
      description: |
        Применяются к новым обращениям и к переназначениям после изменения.
        Только администратор, остальным — `403`.
      operationId: adminUpdateDeadlineRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 3
              items:
                $ref: '#/components/schemas/DeadlineRule'
            example:
              - {priority: high, business_days: 1}
              - {priority: medium, business_days: 2}
              - {priority: low, business_days: 5}
      responses:
        '200':
          description: Правила после изменения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadlineRule'
              example:
                - {priority: high, business_days: 1}
                - {priority: medium, business_days: 2}
                - {priority: low, business_days: 5}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: Общие настройки
      description: Только администратор, остальным — `403`.
      operationId: adminGetSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                digest_time: '09:00'
                timezone: '+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [admin]
      summary: Изменить время утренней сводки
      description: Только администратор, остальным — `403`.
      operationId: adminUpdateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                digest_time:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            example:
              digest_time: '09:00'
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                digest_time: '09:00'
                timezone: '+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии из `/auth/*`
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Сервисный ключ бота (только бот, из окружения)
    telegramId:
      type: apiKey
      in: header
      name: X-Telegram-Id
      description: Telegram ID пользователя, от имени которого действует бот (вместе с `X-Service-Key`)

  parameters:
    AppealId:
      name: appeal_id
      in: path
      required: true
      schema:
        type: integer
    DiscussionId:
      name: discussion_id
      in: path
      required: true
      schema:
        type: integer
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema:
        type: integer
    MeetingDraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    Session:
      description: Сессия выдана
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
          examples:
            employee:
              $ref: '#/components/examples/SessionEmployee'
    Unauthorized:
      description: Нет токена, токен истёк или неверный сервисный ключ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Требуется вход.
              details: null
    InvalidTelegramAuth:
      description: Подпись данных Telegram не прошла проверку или данные устарели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_telegram_auth
              message: Не удалось подтвердить вход через Telegram.
              details: null
    LoginForbidden:
      description: Пользователя нет в списке сотрудников (`user_not_registered`) или доступ отключён (`user_disabled`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_registered:
              value:
                error:
                  code: user_not_registered
                  message: Вас нет в списке сотрудников. Обратитесь к администратору.
                  details: null
            disabled:
              value:
                error:
                  code: user_disabled
                  message: Доступ отключён. Обратитесь к администратору.
                  details: null
    DevLoginDisabled:
      description: Dev-вход выключен настройкой окружения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: dev_login_disabled
              message: Dev-вход выключен.
              details: null
    Forbidden:
      description: Действие недоступно роли пользователя или обращение ему не видно
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия.
              details: null
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Обращение не найдено.
              details: null
    Conflict:
      description: Конфликт с текущим состоянием (`conflict`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: Обращение уже вынесено на обсуждение.
              details: null
    InvalidTransition:
      description: Недопустимый переход статуса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_transition
              message: Из статуса «Новое» нельзя перейти в «Реализовано».
              details:
                action: implement
                status: new
                allowed_actions: [take, reassign, send_message]
    ValidationError:
      description: Ошибка в данных запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите причину отказа.
              details:
                fields:
                  - {field: reason, message: Обязательное поле}
    VotingClosed:
      description: Срок обсуждения прошёл или итог зафиксирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: voting_closed
              message: Обсуждение завершено.
              details: null
    FileTooLarge:
      description: Файл больше допустимого
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: file_too_large
              message: Файл больше 20 МБ.
              details: {max_bytes: 20971520}
    MeetingFileTooLarge:
      description: Запись больше допустимого
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: file_too_large
              message: Запись больше 200 МБ.
              details: {max_bytes: 209715200}
    AiUnavailable:
      description: Claude или ElevenLabs недоступны — предложите заполнить форму
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ai_unavailable
              message: Разбор сейчас недоступен. Заполните обращение через форму.
              details: null

  schemas:
    # ------------------------------------------------ errors
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Текст для пользователя на русском
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: |
                Для `validation_error` — `{"fields": [{"field": "...", "message": "..."}]}`.
                Для `invalid_transition` — `{"action", "status", "allowed_actions"}`.
    ErrorCode:
      type: string
      description: |
        `unauthorized` 401 · `invalid_telegram_auth` 401 · `invalid_login_code` 401 ·
        `user_not_registered` 403 · `user_disabled` 403 · `dev_login_disabled` 403 · `forbidden` 403 ·
        `not_found` 404 · `conflict` 409 · `invalid_transition` 409 · `merge_not_allowed` 409 · `voting_closed` 409 ·
        `file_too_large` 413 · `validation_error` 422 · `audio_empty` 422 · `audio_too_long` 422 ·
        `too_many_requests` 429 ·
        `bitrix_unavailable` 502 · `ai_unavailable` 503 · `internal_error` 500
      enum:
        - unauthorized
        - invalid_telegram_auth
        - invalid_login_code
        - user_not_registered
        - user_disabled
        - dev_login_disabled
        - forbidden
        - not_found
        - conflict
        - invalid_transition
        - merge_not_allowed
        - voting_closed
        - file_too_large
        - validation_error
        - audio_empty
        - audio_too_long
        - too_many_requests
        - bitrix_unavailable
        - ai_unavailable
        - internal_error

    # ------------------------------------------------ enums
    Role:
      type: string
      enum: [employee, head, admin, owner]
      description: employee — сотрудник, head — руководитель подразделения, admin — администратор, owner — собственник
    AppealType:
      type: string
      enum: [problem, suggestion, praise]
      description: problem — проблема, suggestion — предложение, praise — положительный отзыв
    Priority:
      type: string
      enum: [high, medium, low]
    AppealStatus:
      type: string
      enum: [new, in_review, awaiting_info, in_progress, implemented, rejected, closed]
      description: |
        new — Новое, in_review — На рассмотрении, awaiting_info — Ожидает уточнения, in_progress — В работе,
        implemented — Реализовано, rejected — Отклонено, closed — Закрыто
    AppealSource:
      type: string
      enum: [bot, form, meeting]
    AppealScope:
      type: string
      enum: [all, mine, assigned, department, unassigned]
      description: |
        all — всё видимое (по умолчанию); mine — я автор или участник; assigned — я ответственный;
        department — обращения моего подразделения (руководитель); unassigned — без ответственного (администратор)
    DueFilter:
      type: string
      enum: [overdue, due_today, due_week, no_deadline]
    DueState:
      type: string
      enum: [on_time, due_soon, overdue, answered, no_deadline]
      description: |
        on_time — срок не скоро; due_soon — меньше суток; overdue — просрочен;
        answered — первый ответ уже дан; no_deadline — срока нет (отзыв или нет ответственного)
    AppealAction:
      type: string
      enum:
        - take
        - request_info
        - reply_clarification
        - start_work
        - reject
        - implement
        - accept_feedback
        - merge
        - reassign
        - publish_discussion
        - create_bitrix_task
        - send_message
        - upload_attachment
    ViewerRelation:
      type: string
      enum: [author, participant, assignee, department_head, owner, admin]
    ClosedReason:
      type: string
      enum: [feedback_accepted, merged]
    DiscussionStatus:
      type: string
      enum: [open, closed]
    VoteValue:
      type: string
      enum: [for, against]
    NameConsent:
      type: string
      enum: [pending, shown, hidden]
    MeetingStatus:
      type: string
      enum: [processing, ready, failed]
    MeetingDraftStatus:
      type: string
      enum: [pending, confirmed, discarded]
    NotificationKind:
      type: string
      enum:
        - appeal_assigned
        - appeal_created
        - status_changed
        - clarification_requested
        - clarification_answered
        - message_received
        - deadline_reminder
        - escalation_head
        - appeal_merged
        - name_consent_request
        - discussion_closed
        - digest
      description: |
        appeal_assigned — ответственному: новое назначение (в т. ч. переназначение);
        appeal_created — автору: номер, ответственный, срок;
        status_changed — автору и участникам; clarification_requested — автору: вопрос;
        clarification_answered — ответственному: ответ автора; message_received — новое сообщение в переписке;
        deadline_reminder — ответственному: срок истёк; escalation_head — руководителю: ответственный не ответил;
        appeal_merged — автору повтора; name_consent_request — автору при выносе на обсуждение;
        discussion_closed — автору: итог обсуждения; digest — утренняя сводка
    NotificationButtonType:
      type: string
      enum: [open_appeal, open_analytics, open_discussion, reply_clarification, name_consent_show, name_consent_hide]

    # ------------------------------------------------ refs
    DepartmentRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    UserBrief:
      type: object
      required: [id, full_name, role, department]
      properties:
        id:
          type: integer
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
    AppealRef:
      type: object
      required: [id, number, summary, status, type]
      properties:
        id:
          type: integer
        number:
          type: string
          example: A-003
        summary:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AppealStatus'
        type:
          $ref: '#/components/schemas/AppealType'

    # ------------------------------------------------ auth / users
    MiniAppLoginRequest:
      type: object
      required: [init_data]
      properties:
        init_data:
          type: string
          description: '`Telegram.WebApp.initData` без изменений'
    TelegramWidgetLoginRequest:
      type: object
      required: [id, first_name, auth_date, hash]
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        photo_url:
          type: string
        auth_date:
          type: integer
        hash:
          type: string
    CodeLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    LoginCode:
      type: object
      required: [code, expires_at, ttl_seconds]
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
    User:
      type: object
      required: [id, telegram_id, full_name, position, role, department, is_absent, is_disabled]
      properties:
        id:
          type: integer
        telegram_id:
          type: integer
          format: int64
          nullable: true
          description: Только для администратора и для самого пользователя
        full_name:
          type: string
        position:
          type: string
          nullable: true
          description: Должность, например «Сотрудник закупок»
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        is_absent:
          type: boolean
        is_disabled:
          type: boolean
    Permissions:
      type: object
      description: Что показывать в навигации. Права на конкретное обращение — в `Appeal.allowed_actions`.
      required:
        - can_create_appeal
        - can_process_appeals
        - can_view_department
        - can_view_all_appeals
        - analytics_scope
        - can_upload_meetings
        - can_manage_settings
        - can_view_unassigned
      properties:
        can_create_appeal:
          type: boolean
        can_process_appeals:
          type: boolean
          description: Есть очередь назначенных (ответственный по категории или по обращению), руководитель или собственник
        can_view_department:
          type: boolean
        can_view_all_appeals:
          type: boolean
        analytics_scope:
          type: string
          enum: [none, department, company]
        can_upload_meetings:
          type: boolean
        can_manage_settings:
          type: boolean
        can_view_unassigned:
          type: boolean
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [responsible_for, deputy_for, assigned_open_count, permissions]
          properties:
            responsible_for:
              type: array
              description: Категории, где пользователь — ответственный
              items:
                $ref: '#/components/schemas/CategoryRef'
            deputy_for:
              type: array
              description: Категории, где пользователь — заместитель
              items:
                $ref: '#/components/schemas/CategoryRef'
            assigned_open_count:
              type: integer
              description: Открытых обращений, где пользователь — ответственный
            permissions:
              $ref: '#/components/schemas/Permissions'
    UserCreate:
      type: object
      required: [telegram_id, full_name, role]
      properties:
        telegram_id:
          type: integer
          format: int64
        full_name:
          type: string
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        department_id:
          type: integer
          nullable: true
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        department_id:
          type: integer
          nullable: true
        is_absent:
          type: boolean
        is_disabled:
          type: boolean

    # ------------------------------------------------ org
    Department:
      type: object
      required: [id, name, head]
      properties:
        id:
          type: integer
        name:
          type: string
        head:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
    DepartmentWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        head_id:
          type: integer
          nullable: true
    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        head_id:
          type: integer
          nullable: true
    Category:
      type: object
      required: [id, name, department, responsible, deputy, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          $ref: '#/components/schemas/DepartmentRef'
        responsible:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        deputy:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        is_active:
          type: boolean
    CategoryWrite:
      type: object
      required: [name, department_id]
      properties:
        name:
          type: string
        department_id:
          type: integer
        responsible_id:
          type: integer
          nullable: true
        deputy_id:
          type: integer
          nullable: true
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        department_id:
          type: integer
        responsible_id:
          type: integer
          nullable: true
        deputy_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
    DeadlineRule:
      type: object
      required: [priority, business_days]
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        business_days:
          type: integer
          minimum: 1
          maximum: 30
    SystemSettings:
      type: object
      required: [digest_time, timezone]
      properties:
        digest_time:
          type: string
          example: '09:00'
          description: Время утренней сводки, ЧЧ:ММ по часовому поясу системы
        timezone:
          type: string
          example: '+05:00'
          description: Часовой пояс системы, задаётся окружением; только чтение

    # ------------------------------------------------ dictionaries
    LabeledCode:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    Dictionaries:
      type: object
      required: [appeal_types, priorities, statuses, roles, sources, actions, due_filters, timezone]
      properties:
        appeal_types:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        statuses:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/LabeledCode'
              - type: object
                required: [is_final]
                properties:
                  is_final:
                    type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        actions:
          type: array
          description: Подписи кнопок и справочная таблица переходов. Доступность — только по `Appeal.allowed_actions`.
          items:
            allOf:
              - $ref: '#/components/schemas/LabeledCode'
              - type: object
                required: [from, to]
                properties:
                  from:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppealStatus'
                  to:
                    type: string
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/AppealStatus'
        due_filters:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        timezone:
          type: string

    # ------------------------------------------------ appeals
    AppealCreate:
      type: object
      required: [type, priority, text]
      properties:
        type:
          $ref: '#/components/schemas/AppealType'
        category_id:
          type: integer
          nullable: true
          description: null — категория не определена, обращение уходит в очередь администратора
        priority:
          $ref: '#/components/schemas/Priority'
        text:
          type: string
          minLength: 1
        summary:
          type: string
          nullable: true
          description: Краткая суть; если пусто — первые слова текста
        proposed_solution:
          type: string
          nullable: true
        source:
          type: string
          enum: [form, bot]
          default: form
        forwarded_from:
          type: string
          nullable: true
          description: Для пересылки в бот — откуда переслано (из `TextDraftRequest.forwarded_from`)
    AppealListItem:
      type: object
      required:
        - id
        - number
        - type
        - category
        - department
        - priority
        - status
        - summary
        - author
        - assignee
        - source
        - first_response_due_at
        - due_state
        - escalation_level
        - participants_count
        - merged_into
        - access
        - has_unread
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        number:
          type: string
          example: A-021
        type:
          $ref: '#/components/schemas/AppealType'
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
          description: Подразделение категории — по нему руководитель видит обращение
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/AppealStatus'
        summary:
          type: string
          nullable: true
        author:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: null для участника склеенного повтора (чужое имя скрыто)
        assignee:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: null — в очереди нераспределённых
        source:
          $ref: '#/components/schemas/AppealSource'
        first_response_due_at:
          type: string
          format: date-time
          nullable: true
          description: Срок первого ответа — единственный срок в системе. null у отзывов и нераспределённых.
        due_state:
          $ref: '#/components/schemas/DueState'
        escalation_level:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 — нет; 1 — напомнили ответственному; 2 — уведомили руководителя; 3 — «Зависло» в сводке собственника
        participants_count:
          type: integer
          description: Сколько человек сообщили о проблеме (автор + авторы присоединённых повторов)
        merged_into:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppealRef'
          description: Для повтора — основное обращение (его статус показывается автору повтора)
        access:
          type: string
          enum: [full, participant]
          description: participant — пользователь видит основное обращение только как участник склеенного повтора
        has_unread:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Appeal:
      allOf:
        - $ref: '#/components/schemas/AppealListItem'
        - type: object
          required:
            - text
            - proposed_solution
            - first_response_at
            - decision
            - rejection_reason
            - result
            - public_summary
            - public_result
            - forwarded_from
            - closed_reason
            - bitrix_task
            - discussion
            - attachments
            - viewer_relations
            - allowed_actions
          properties:
            text:
              type: string
              nullable: true
              description: null при access=participant
            proposed_solution:
              type: string
              nullable: true
            first_response_at:
              type: string
              format: date-time
              nullable: true
            decision:
              type: string
              nullable: true
              description: Принятое решение при переводе в работу
            rejection_reason:
              type: string
              nullable: true
            result:
              type: string
              nullable: true
              description: Зафиксированный результат («Реализовано»)
            public_summary:
              type: string
              nullable: true
              description: Что предложили — публичная формулировка для ленты реализованного
            public_result:
              type: string
              nullable: true
              description: Что сделали — публичная формулировка результата для ленты
            forwarded_from:
              type: string
              nullable: true
              description: Откуда переслано сообщение, если обращение подано пересылкой в бот
            closed_reason:
              type: string
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ClosedReason'
            bitrix_task:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/BitrixTask'
            discussion:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/DiscussionRef'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            viewer_relations:
              type: array
