      summary: Переназначить ответственного с причиной
      description: |
        Руководитель (в своём подразделении), администратор, собственник. Срок первого ответа
        отсчитывается заново, причина пишется в историю. Этим же маршрутом администратор
        назначает ответственного из очереди нераспределённых.
        Ответственному, сотруднику — `403`.
      operationId: reassignAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id, reason]
              properties:
                assignee_id:
                  type: integer
                reason:
                  type: string
                  minLength: 1
