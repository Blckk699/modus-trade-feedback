  # ---------------------------------------------------------------- drafts
  /api/v1/drafts/text:
    post:
      tags: [drafts]
      summary: Черновик обращения из текста или пересланного сообщения
      description: |
        Claude предлагает тип, категорию из справочника, приоритет, краткую суть и предлагаемое решение.
        Черновик ничего не создаёт и не хранится: автор правит поля и отправляет `POST /appeals` с `source=bot`.
        Если AI-сервис недоступен — `503 ai_unavailable`, форма продолжает работать.
      operationId: draftFromText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextDraftRequest'
            example:
              text: Опять в заявке на камеры не написали, для какого объекта и какое разрешение нужно, третий раз переспрашиваю у продаж
              forwarded_from: Чат «Закупки — продажи»
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealDraft'
              examples:
                DraftExample:
                  $ref: '#/components/examples/DraftExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/AiUnavailable'
  /api/v1/drafts/voice:
    post:
      tags: [drafts]
      summary: Черновик обращения из голосового сообщения
      description: |
        ElevenLabs Scribe расшифровывает аудио, затем Claude делает черновик. Расшифровка возвращается в `transcript`
        и в `text` черновика. Пустое аудио — `422 audio_empty`, длиннее 5 минут — `422 audio_too_long`.
      operationId: draftFromVoice
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ogg/opus из Telegram, mp3, m4a, wav
      responses:
        '200':
          description: Черновик с расшифровкой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealDraft'
              examples:
                VoiceDraftExample:
                  $ref: '#/components/examples/VoiceDraftExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/AiUnavailable'

