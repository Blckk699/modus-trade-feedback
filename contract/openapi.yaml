  # ---------------------------------------------------------------- appeals
  /api/v1/appeals:
    get:
      tags: [appeals]
      summary: Список обращений, которые видит пользователь
      description: |
        Видимость по матрице доступа: сотрудник — свои (автор или участник склеенного),
        ответственный — назначенные, руководитель — своего подразделения, администратор и собственник — все.
        `scope` сужает выборку внутри видимого. Очередь ответственного: `scope=assigned&sort=due_asc`.
        Очередь нераспределённых для администратора: `scope=unassigned`.
      operationId: listAppeals
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/AppealScope'
        - name: status
          in: query
          description: Один или несколько статусов
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AppealStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AppealType'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: category_id
          in: query
          schema:
            type: integer
        - name: department_id
          in: query
          schema:
            type: integer
        - name: due
          in: query
          schema:
            $ref: '#/components/schemas/DueFilter'
        - name: q
          in: query
          description: Поиск по номеру, сути и тексту
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_desc, created_asc, due_asc]
            default: created_desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealPage'
              examples:
                AppealPageExample:
                  $ref: '#/components/examples/AppealPageExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [appeals]
      summary: Создать обращение
      description: |
        Форма в клиентах (`source=form`) и подтверждённый черновик из бота (`source=bot`).
        Работает без AI-сервисов. Бэкенд сразу маршрутизирует обращение: назначает ответственного
        по правилу категории (или заместителя, если ответственный отсутствует) и срок первого ответа.
        Если ответственного нет или категория не указана, `assignee` = null и обращение в очереди администратора.
        Вложения загружаются после создания: `POST /appeals/{appeal_id}/attachments`.
      operationId: createAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealCreate'
            example:
              type: problem
              category_id: 1
              priority: medium
              text: В заявках на приобретение оборудования иногда не хватает назначения изделия и требуемых параметров. Предлагаю добавить обязательные поля, чтобы сократить число уточнений.
              summary: В заявках на оборудование не хватает назначения и параметров
              proposed_solution: Добавить обязательные поля «назначение» и «параметры» в шаблон заявки
              source: form
      responses:
        '201':
          description: Обращение создано и назначено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealCreated:
                  $ref: '#/components/examples/AppealCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    get:
      tags: [appeals]
      summary: Карточка обращения
      description: |
        `access=participant` — пользователь видит основное обращение как участник склеенного повтора:
        статус, ответственного, срок и итог, но `text`, `proposed_solution`, `author` и вложения скрыты (null / пусто).
      operationId: getAppeal
      responses:
        '200':
          description: Обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                assignee_view:
                  $ref: '#/components/examples/AppealA001AssigneeView'
                rejected:
                  $ref: '#/components/examples/AppealA017Rejected'
                implemented:
                  $ref: '#/components/examples/AppealA004Implemented'
                participant_view:
                  $ref: '#/components/examples/AppealParticipantView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/appeals/{appeal_id}/history:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    get:
      tags: [appeals]
      summary: История событий обращения
      description: По возрастанию времени. Участник склеенного повтора историю основного не видит (403).
      operationId: getAppealHistory
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEvent'
              example:
                - id: 101
                  appeal_id: 21
                  kind: created
                  actor: {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                  field: null
                  old_value: null
                  new_value: null
                  comment: Подано через форму
                  created_at: '2026-11-10T10:15:00+05:00'
                - id: 102
                  appeal_id: 21
                  kind: assigned
                  actor: null
                  field: assignee
                  old_value: null
                  new_value: Марат Сейткали
                  comment: По правилу категории «Межотдельное взаимодействие»
                  created_at: '2026-11-10T10:15:00+05:00'
                - id: 103
                  appeal_id: 21
                  kind: status_changed
                  actor: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                  field: status
                  old_value: new
                  new_value: in_review
                  comment: null
                  created_at: '2026-11-10T11:02:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- actions
  /api/v1/appeals/{appeal_id}/take:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Взять на рассмотрение (Новое → На рассмотрении)
      description: |
        Фиксирует время первого ответа, если оно ещё не зафиксировано.
        Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.
      operationId: takeAppeal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  nullable: true
                  description: Необязательный первый ответ автору, попадает в переписку
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealTaken:
                  $ref: '#/components/examples/AppealTaken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/v1/appeals/{appeal_id}/nudge:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Напомнить ответственному об обращении без первого ответа
      description: |
        Ответственный получает уведомление `nudge` в колокольчик и в бот, в историю обращения пишется событие
        `nudged` (`new_value` — кому напомнили). Статус, срок и ответственный не меняются.
        Кто: руководитель подразделения обращения и собственник. Ответственному, автору, администратору — `403`.
        Когда: обращение не завершено, ответственный назначен и это не сам пользователь, первого ответа ещё нет,
        обращение не положительный отзыв — тогда в `allowed_actions` есть `nudge`; иначе `409 invalid_transition`
        с причиной в `message`.
        Не чаще раза в 4 часа на обращение, кто бы ни напоминал: раньше — `429 too_many_requests`,
        в `details.next_allowed_at` — когда можно снова, `message` готов для показа.
      operationId: nudgeAssignee
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '429':
          description: Ответственному уже напоминали меньше 4 часов назад (`too_many_requests`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: too_many_requests
                  message: Ответственному уже напоминали. Следующее напоминание — после 14:30.
                  details: {next_allowed_at: '2026-11-13T14:30:00+05:00'}
  /api/v1/appeals/{appeal_id}/request-info:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Задать автору уточняющий вопрос (На рассмотрении → Ожидает уточнения)
      description: |
        Вопрос попадает в переписку с `is_clarification_question=true`, автору уходит уведомление.
        Срок первого ответа к этому моменту уже выполнен (первый ответ фиксирует `take`), других сроков нет.
        Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.
      operationId: requestInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
            example:
              question: Пришлите, пожалуйста, пример заявки, где не хватило параметров.
      responses:
        '200':
          description: Обращение после действия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealAwaitingInfo:
                  $ref: '#/components/examples/AppealAwaitingInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}/start-work:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      tags: [appeal-actions]
      summary: Принять решение и перевести в работу (На рассмотрении → В работе)
      description: 'Кто: ответственный, руководитель подразделения обращения, собственник. Руководитель и собственник действуют без смены ответственного. Администратору и остальным — `403`.'
      operationId: startWork
