  # ---------------------------------------------------------------- live (WebSocket)
  /api/v1/ws:
    get:
      tags: [live]
      summary: Живые обновления (WebSocket)
      description: |
        Соединение WebSocket: `wss://<сервер>/api/v1/ws`. Сервер сам сообщает клиенту, что изменилось;
        клиент перезапрашивает данные обычными маршрутами. Все сообщения — текстовые кадры с JSON-объектом,
        у каждого есть поле `type`.

        **Вход.** Токен в адресе не передаётся. Первым сообщением клиент отправляет
        `{"type": "auth", "token": "<access_token сессии>"}` (`WsAuth`). Сервер отвечает `ready` (`WsReady`)
        и после этого начинает слать события. Только сессия клиента: сервисный ключ бота не принимается.
        До `ready` событий нет; любое другое первое сообщение закрывает соединение с кодом `4401`.

        **События** (`WsEvent`) — только о том, что пользователь видит по текущим правам:

        | `type` | Когда | Кому |
        |---|---|---|
        | `appeal.created` | подано обращение | всем, кто его видит: автор, ответственный, руководитель подразделения, собственник, администратор |
        | `appeal.updated` | в историю обращения записано событие: статус, ответственный, срок, эскалация, вложение, склейка и т. д. | всем, кто видит обращение, включая участника склеенного повтора |
        | `message.created` | новое сообщение в приватной переписке | тем, кто читает переписку: автор, ответственный, руководитель, собственник. Администратору — нет |
        | `notification.created` | пользователю создано уведомление | только получателю, с актуальным счётчиком непрочитанного |
        | `discussion.updated` | обсуждение опубликовано, в нём голос, комментарий, решение об имени или итог | всем подключённым |

        В событии только идентификаторы и признак того, что поменялось. Текстов обращений, сообщений,
        комментариев и уведомлений в событиях нет. Права проверяются в момент отправки: потерял доступ —
        событий по обращению больше нет. Свои собственные действия пользователь тоже получает событием
        (так обновляются другие его вкладки и устройства).

        **Гарантии.** Событие отправляется после того, как изменение сохранено, обычно в пределах секунды.
        Пропущенные события не досылаются и не хранятся: после подключения и после каждого переподключения
        клиент сам перезапрашивает то, что показывает. Одно действие может дать несколько событий
        (например, `appeal.updated` и `notification.created`); порядок между ними не гарантируется.
        Неизвестный `type` и неизвестные поля клиент пропускает — список событий будет расширяться.

        **Пинг.** Клиент может в любой момент отправить `{"type": "ping"}` и получит `{"type": "pong"}`;
        рекомендуется раз в 30 секунд. Сервер, кроме того, шлёт служебные ping-кадры протокола WebSocket —
        браузер отвечает на них сам. Переподключение — на клиенте, с нарастающей паузой.

        **Коды закрытия:**

        | Код | Причина | Что делать клиенту |
        |---|---|---|
        | `4401` | неверный или просроченный токен, первое сообщение не `auth`, сессия истекла или закрыта (выход, смена или сброс пароля), доступ отключён | не переподключаться с тем же токеном; отправить пользователя на вход |
        | `4408` | за 10 секунд после открытия не пришёл `auth` | переподключиться и сразу отправить `auth` |
        | `4400` | сообщение не JSON-объект, без `type` или длиннее 4 КБ | исправить клиент |
        | `4429` | у пользователя больше 10 одновременных соединений — закрывается самое старое; либо с одного адреса открыто больше 20 соединений, ещё не отправивших `auth`, — закрывается новое | не переподключать закрытое |
        | `1001`, `1012` | сервер перезапускается | переподключиться |

        Маршрут описан как `GET`, потому что соединение открывается HTTP-запросом с `Upgrade: websocket`.
        Мок-сервер Prism его не поддерживает.
      operationId: openLiveUpdates
      security: []
      responses:
        '101':
          description: |
            Соединение переведено на WebSocket. От клиента — `WsClientMessage`, от сервера — `WsServerMessage`.

  # ---------------------------------------------------------------- bot
  /api/v1/bot/notifications/pending:
    get:
      tags: [bot]
      summary: Неотправленные уведомления для доставки в Telegram
      description: |
        Бот опрашивает раз в несколько секунд. Возвращаются уведомления без подтверждённой доставки,
        у которых наступило время следующей попытки. Подтверждённое (`ack`) больше не возвращается.
      operationId: listPendingNotifications
      security:
        - serviceKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Уведомления к отправке, старые первыми
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotNotification'
              example:
                - {"id": 905, "kind": "clarification_requested", "text": "По обращению <b>A-005</b> вопрос от ответственного:\nУточните, пожалуйста, какие виды документов чаще всего «теряются» между подразделениями?", "appeal": {"id": 5, "number": "A-005", "summary": "Не видно, на каком этапе пакет документов", "status": "awaiting_info", "type": "problem"}, "path": "/appeals/5", "buttons": [{"type": "reply_clarification", "text": "Ответить", "appeal_id": 5, "discussion_id": null}, {"type": "open_appeal", "text": "Открыть обращение", "appeal_id": 5, "discussion_id": null}], "is_read": false, "created_at": "2026-11-09T12:40:00+05:00", "recipient": {"user_id": 6, "telegram_id": 100000006}, "attempts": 0}
                - {"id": 906, "kind": "name_consent_request", "text": "Ваше обращение <b>A-020</b> вынесено на общее обсуждение.\nПоказывать ваше имя? Без согласия будет указано только подразделение.", "appeal": {"id": 20, "number": "A-020", "summary": "Публиковать обзор завершённых внутренних улучшений", "status": "in_review", "type": "suggestion"}, "path": "/discussions/12", "buttons": [{"type": "name_consent_show", "text": "Показать имя", "appeal_id": 20, "discussion_id": 12}, {"type": "name_consent_hide", "text": "Скрыть", "appeal_id": 20, "discussion_id": 12}], "is_read": false, "created_at": "2026-11-10T13:00:00+05:00", "recipient": {"user_id": 4, "telegram_id": 100000004}, "attempts": 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/bot/notifications/{notification_id}/ack:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [bot]
      summary: Подтвердить доставку
      operationId: ackNotification
      security:
        - serviceKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_message_id:
                  type: integer
                  nullable: true
                  description: ID отправленного сообщения — бот по нему узнаёт, на какой вопрос ответил пользователь (reply)
      responses:
        '204':
          description: Доставка подтверждена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/bot/notifications/{notification_id}/fail:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [bot]
      summary: Сообщить о неудачной доставке
      description: Уведомление вернётся в `pending` позже с нарастающей паузой. Пользователь заблокировал бота — `permanent=true`.
      operationId: failNotification
      security:
        - serviceKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                permanent:
                  type: boolean
                  default: false
      responses:
        '204':
          description: Попытка учтена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

