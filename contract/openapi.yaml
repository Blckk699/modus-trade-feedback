openapi: 3.0.3
info:
  title: Модус Трейд — обращения и предложения сотрудников
  version: 1.0.0
  description: |
    Контракт API бэкенда. Источник истины для клиентов: веб, Mini App, Flutter, бот.
    Спека продукта — `SPEC.md`, правила работы с контрактом — `contract/README.md`.

    ## Общие правила

    - Все маршруты под префиксом `/api/v1` (он уже входит в пути контракта; базовый адрес клиента — хост без префикса).
    - Время — ISO 8601 со смещением. Часовой пояс системы UTC+5, сервер отдаёт время со смещением `+05:00`.
    - Коды перечислений (статусы, типы, роли) — латиница; подписи на русском отдаёт `GET /dictionaries`.
    - Клиент не дублирует правила прав и переходов: у обращения есть `allowed_actions`, у пользователя — `permissions`.
      Действие, которого нет в этих списках, клиент не показывает.
    - Ошибка всегда в формате `Error`: `{"error": {"code": "...", "message": "...", "details": ...}}`.
      `message` можно показывать пользователю как есть, ветвиться — только по `code`.

    ## Авторизация

    - Пользователь: `Authorization: Bearer <access_token>`. Токен выдают маршруты `/auth/*`
      (Mini App, Telegram Login, одноразовый код из бота, dev-вход).
    - Бот: `X-Service-Key: <ключ бота>` и `X-Telegram-Id: <Telegram ID пользователя>` — бот действует от имени
      пользователя, права проверяются так же, как для самого пользователя. Так бот вызывает любые
      пользовательские маршруты. Маршруты `/bot/*` требуют только `X-Service-Key`.
    - Незаведённый пользователь получает `403 user_not_registered`, отключённый — `403 user_disabled`.

    ## Жизненный цикл обращения

    | Действие (`allowed_actions`) | Маршрут | Из статуса | В статус |
    |---|---|---|---|
    | `take` | `POST /appeals/{id}/take` | `new` | `in_review` |
    | `request_info` | `POST /appeals/{id}/request-info` | `in_review` | `awaiting_info` |
    | `reply_clarification` | `POST /appeals/{id}/messages` (автор) | `awaiting_info` | `in_review` |
    | `start_work` | `POST /appeals/{id}/start-work` | `in_review` | `in_progress` |
    | `reject` | `POST /appeals/{id}/reject` | `in_review` | `rejected` |
    | `implement` | `POST /appeals/{id}/implement` | `in_progress` | `implemented` |
    | `accept_feedback` | `POST /appeals/{id}/accept-feedback` | `new` (только отзыв) | `closed` |
    | `merge` | `POST /appeals/{id}/merge` | `new`, `in_review` | `closed` |

    Любой другой переход — `409 invalid_transition`. Отказ без причины, «В работу» без решения и
    «Реализовано» без результата — `422 validation_error`.

    **Кто выполняет действия.** Действия жизненного цикла выполняют ответственный обращения, руководитель
    подразделения обращения и собственник. Руководитель и собственник действуют без смены ответственного:
    для смены есть `reassign`. Администратор видит все обращения, но не меняет статусы, не склеивает,
    не выносит на обсуждение, не создаёт задачи в Битрикс24 и не видит приватную переписку (`403`).
    Автор пишет в переписку и отвечает на уточняющий вопрос.

    **Срок.** В системе один срок — срок первого ответа. Он назначается при маршрутизации и при переназначении,
    первый ответ фиксирует `take` (или `accept_feedback` у отзыва). Уточняющий вопрос задаётся уже после
    первого ответа и на срок не влияет.
servers:
  - url: http://localhost:4010
    description: Мок-сервер (Prism, без состояния)
  - url: http://localhost:8000
    description: Локальный бэкенд
tags:
  - name: system
    description: Служебное
  - name: auth
    description: Вход и сессия
  - name: me
    description: Текущий пользователь
  - name: dictionaries
    description: Справочники
  - name: appeals
    description: Обращения
  - name: appeal-actions
    description: Смена статуса, переназначение, склейка
  - name: messages
    description: Приватная переписка по обращению
  - name: attachments
    description: Вложения
  - name: duplicates
    description: Подсказки о повторах
  - name: drafts
    description: Черновик обращения из текста и голоса (Claude, ElevenLabs)
  - name: discussions
    description: Общие обсуждения
  - name: feed
    description: Лента реализованного
  - name: bitrix
    description: Битрикс24
  - name: meetings
    description: Режим «совещание»
  - name: analytics
    description: Сводка и аналитика
  - name: notifications
    description: Уведомления и счётчик непрочитанного
  - name: bot
    description: Служебные маршруты бота
  - name: admin
    description: Настройки администратора
security:
  - bearerAuth: []
  - serviceKey: []
    telegramId: []

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Проверка живости
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  # ---------------------------------------------------------------- auth
  /api/v1/auth/telegram/mini-app:
    post:
      tags: [auth]
      summary: Вход из Mini App по initData
      description: Бэкенд проверяет подпись `initData` токеном бота и выдаёт сессию.
      operationId: loginMiniApp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniAppLoginRequest'
            example:
              init_data: 'query_id=AAH...&user=%7B%22id%22%3A100000004%7D&auth_date=1794300000&hash=3f2a...'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/telegram/widget:
    post:
      tags: [auth]
      summary: Вход через Telegram Login в вебе
      description: Тело — поля, которые виджет Telegram Login передаёт в колбэк, без изменений.
      operationId: loginTelegramWidget
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWidgetLoginRequest'
            example:
              id: 100000004
              first_name: Айгерим
              last_name: Нурланова
              username: aigerim_demo
              auth_date: 1794300000
              hash: 9b1c0e7d4a...
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/code:
    post:
      tags: [auth]
      summary: Вход в мобильное приложение по одноразовому коду из бота
      description: |
        Код обменивается на сессию один раз и истекает через `ttl_seconds` после выдачи.
        Защита от перебора: после 5 неудачных попыток с одного адреса за 15 минут — `429 too_many_requests`
        (адрес клиента берётся из `X-Forwarded-For` только от доверенного прокси). При массовом переборе
        со многих адресов активные коды сжигаются — пользователь запрашивает новый в боте.
      operationId: loginWithCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLoginRequest'
            example:
              code: '482913'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          description: Код неверный, уже использован или истёк (`invalid_login_code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_login_code
                  message: Код неверный или истёк. Запросите новый код в боте.
                  details: null
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Слишком много неудачных попыток с этого адреса (`too_many_requests`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: too_many_requests
                  message: Слишком много неудачных попыток. Подождите и попробуйте снова.
                  details: null
  /api/v1/auth/login-codes:
    post:
      tags: [auth, bot]
      summary: Выдать одноразовый код входа (только бот)
      description: |
        Бот вызывает с `X-Service-Key` и `X-Telegram-Id` пользователя и показывает код в чате.
        Пользователь вводит код в мобильном приложении (`POST /auth/code`).
      operationId: issueLoginCode
      security:
        - serviceKey: []
          telegramId: []
      responses:
        '201':
          description: Код выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCode'
              example:
                code: '482913'
                expires_at: '2026-11-10T19:35:00+05:00'
                ttl_seconds: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'
  /api/v1/auth/dev/users:
    get:
      tags: [auth]
      summary: Список пользователей для dev-входа
      description: Работает только при `DEV_LOGIN_ENABLED=true`. На сервере для демо выключен — `403 dev_login_disabled`.
      operationId: listDevUsers
      security: []
      responses:
        '200':
          description: Пользователи, под которыми можно войти
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBrief'
              example:
                - {id: 1, full_name: Ержан Касымов, role: owner, department: null}
                - {id: 2, full_name: Анна Ли, role: admin, department: null}
                - {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                - {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                - {id: 6, full_name: Дина Жуматова, role: employee, department: {id: 2, name: Бухгалтерия}}
                - {id: 13, full_name: Даурен Исаев, role: employee, department: {id: 6, name: IT}}
        '403':
          $ref: '#/components/responses/DevLoginDisabled'
  /api/v1/auth/dev/login:
    post:
      tags: [auth]
      summary: Dev-вход под выбранным пользователем
      description: Работает только при `DEV_LOGIN_ENABLED=true`, иначе `403 dev_login_disabled`.
      operationId: devLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
            example:
              user_id: 4
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '403':
          $ref: '#/components/responses/DevLoginDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выход, токен становится недействительным
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сессия закрыта
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      summary: Кто я
      description: |
        Роль, подразделение, назначения ответственным и права для навигации.
        Бот вызывает с `X-Service-Key` и `X-Telegram-Id`, чтобы опознать пользователя:
        незаведённый получает `403 user_not_registered`, отключённый — `403 user_disabled`.
      operationId: getMe
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeEmployee'
                owner:
                  $ref: '#/components/examples/MeOwner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'

  /api/v1/dictionaries:
    get:
      tags: [dictionaries]
      summary: Подписи перечислений и таблица переходов
      operationId: getDictionaries
      security: []
      responses:
        '200':
          description: Справочники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictionaries'
              example:
                appeal_types:
                  - {code: problem, label: Проблема}
                  - {code: suggestion, label: Предложение}
                  - {code: praise, label: Положительный отзыв}
                priorities:
                  - {code: high, label: Высокий}
                  - {code: medium, label: Средний}
                  - {code: low, label: Низкий}
                statuses:
                  - {code: new, label: Новое, is_final: false}
                  - {code: in_review, label: На рассмотрении, is_final: false}
                  - {code: awaiting_info, label: Ожидает уточнения, is_final: false}
                  - {code: in_progress, label: В работе, is_final: false}
                  - {code: implemented, label: Реализовано, is_final: true}
                  - {code: rejected, label: Отклонено, is_final: true}
                  - {code: closed, label: Закрыто, is_final: true}
                roles:
                  - {code: employee, label: Сотрудник}
                  - {code: head, label: Руководитель подразделения}
                  - {code: admin, label: Администратор}
                  - {code: owner, label: Собственник}
                sources:
                  - {code: bot, label: Бот}
                  - {code: form, label: Форма}
                  - {code: meeting, label: Совещание}
                actions:
                  - {code: take, label: Взять на рассмотрение, from: [new], to: in_review}
                  - {code: request_info, label: Задать уточняющий вопрос, from: [in_review], to: awaiting_info}
                  - {code: reply_clarification, label: Ответить на вопрос, from: [awaiting_info], to: in_review}
                  - {code: start_work, label: В работу, from: [in_review], to: in_progress}
                  - {code: reject, label: Отклонить, from: [in_review], to: rejected}
                  - {code: implement, label: Реализовано, from: [in_progress], to: implemented}
                  - {code: accept_feedback, label: Принять отзыв, from: [new], to: closed}
                  - {code: merge, label: Присоединить к основному, from: [new, in_review], to: closed}
                  - {code: reassign, label: Переназначить, from: [new, in_review, awaiting_info, in_progress], to: null}
                  - {code: publish_discussion, label: Вынести на обсуждение, from: [new, in_review, awaiting_info, in_progress, implemented, rejected], to: null}
                  - {code: create_bitrix_task, label: Создать задачу в Битрикс24, from: [in_review, awaiting_info, in_progress], to: null}
                  - {code: send_message, label: Написать в переписку, from: [new, in_review, awaiting_info, in_progress], to: null}
                  - {code: upload_attachment, label: Приложить файл, from: [new, in_review, awaiting_info, in_progress], to: null}
                due_filters:
                  - {code: overdue, label: Просрочено}
                  - {code: due_today, label: Срок сегодня}
                  - {code: due_week, label: Срок на этой неделе}
                  - {code: no_deadline, label: Без срока}
                timezone: '+05:00'

  # ---------------------------------------------------------------- appeals
  /api/v1/appeals:
    get:
      tags: [appeals]
      summary: Список обращений, которые видит пользователь
      description: |
        Видимость по матрице доступа: сотрудник — свои (автор или участник склеенного),
        ответственный — назначенные, руководитель — своего подразделения, администратор и собственник — все.
        `scope` сужает выборку внутри видимого. Очередь ответственного: `scope=assigned&sort=due_asc`.
        Очередь нераспределённых для администратора: `scope=unassigned`.
      operationId: listAppeals
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/AppealScope'
        - name: status
          in: query
          description: Один или несколько статусов
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AppealStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AppealType'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: category_id
          in: query
          schema:
            type: integer
        - name: department_id
          in: query
          schema:
            type: integer
        - name: due
          in: query
          schema:
            $ref: '#/components/schemas/DueFilter'
        - name: q
          in: query
          description: Поиск по номеру, сути и тексту
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_desc, created_asc, due_asc]
            default: created_desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealPage'
              examples:
                AppealPageExample:
                  $ref: '#/components/examples/AppealPageExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [appeals]
      summary: Создать обращение
      description: |
        Форма в клиентах (`source=form`) и подтверждённый черновик из бота (`source=bot`).
        Работает без AI-сервисов. Бэкенд сразу маршрутизирует обращение: назначает ответственного
        по правилу категории (или заместителя, если ответственный отсутствует) и срок первого ответа.
        Если ответственного нет или категория не указана, `assignee` = null и обращение в очереди администратора.
        Вложения загружаются после создания: `POST /appeals/{appeal_id}/attachments`.
      operationId: createAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealCreate'
            example:
              type: problem
              category_id: 1
              priority: medium
              text: В заявках на приобретение оборудования иногда не хватает назначения изделия и требуемых параметров. Предлагаю добавить обязательные поля, чтобы сократить число уточнений.
              summary: В заявках на оборудование не хватает назначения и параметров
              proposed_solution: Добавить обязательные поля «назначение» и «параметры» в шаблон заявки
              source: form
      responses:
        '201':
          description: Обращение создано и назначено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                AppealCreated:
                  $ref: '#/components/examples/AppealCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/appeals/{appeal_id}:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    get:
      tags: [appeals]
      summary: Карточка обращения
      description: |
        `access=participant` — пользователь видит основное обращение как участник склеенного повтора:
        статус, ответственного, срок и итог, но `text`, `proposed_solution`, `author` и вложения скрыты (null / пусто).
      operationId: getAppeal
      responses:
        '200':
          description: Обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              examples:
                assignee_view:
                  $ref: '#/components/examples/AppealA001AssigneeView'
                rejected:
                  $ref: '#/components/examples/AppealA017Rejected'
                implemented:
                  $ref: '#/components/examples/AppealA004Implemented'
                participant_view:
                  $ref: '#/components/examples/AppealParticipantView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/appeals/{appeal_id}/history:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    get:
      tags: [appeals]
      summary: История событий обращения
      description: По возрастанию времени. Участник склеенного повтора историю основного не видит (403).
      operationId: getAppealHistory
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEvent'
              example:
                - id: 101
                  appeal_id: 21
                  kind: created
                  actor: {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                  field: null
                  old_value: null
                  new_value: null
                  comment: Подано через форму
                  created_at: '2026-11-10T10:15:00+05:00'
                - id: 102
                  appeal_id: 21
                  kind: assigned
                  actor: null
                  field: assignee
                  old_value: null
                  new_value: Марат Сейткали
