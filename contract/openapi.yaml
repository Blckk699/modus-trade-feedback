  /api/v1/meetings:
    get:
      tags: [meetings]
      summary: Совещания, загруженные пользователем
      description: Руководитель и собственник видят загруженные ими записи. Остальным — `403`.
      operationId: listMeetings
      responses:
        '200':
          description: Новые сверху
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingBrief'
              example:
                - id: 3
                  title: Планёрка закупок 10.11
                  status: ready
                  drafts_total: 3
                  drafts_pending: 2
                  uploaded_by: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                  created_at: '2026-11-10T12:00:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [meetings]
      summary: Загрузить аудиозапись совещания
      description: |
        Обработка идёт в фоне: ответ сразу со `status=processing`. Клиент опрашивает `GET /meetings/{id}`
        раз в несколько секунд, пока статус не станет `ready` или `failed`. До 200 МБ.
        Только руководитель и собственник, остальным — `403`.
      operationId: uploadMeeting
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: mp3, m4a, wav, ogg, webm
                title:
                  type: string
      responses:
        '202':
          description: Запись принята, идёт обработка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
              example:
                id: 3
                title: Планёрка закупок 10.11
                status: processing
                error: null
                transcript: null
                uploaded_by: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                drafts: []
                created_at: '2026-11-10T12:00:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/MeetingFileTooLarge'
