                $ref: '#/components/schemas/AccessRequest'
              example:
                {id: 7, status: approved, full_name: Сергей Ким, email: null, telegram_username: sergey_kim, department: {id: 3, name: Продажи}, comment: 'Менеджер по продажам, вышел 10 ноября', created_at: '2026-11-11T09:12:00+05:00', updated_at: '2026-11-11T09:30:00+05:00', assigned_role: employee, assigned_department: {id: 3, name: Продажи}, decided_by: {id: 2, full_name: Анна Ли, role: admin, department: null}, decided_at: '2026-11-11T09:30:00+05:00', reject_reason: null, user_id: 21}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/access-requests/{request_id}/reject:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [access]
      summary: Отклонить заявку
      description: |
        Администратор и собственник. Причина необязательна, заявитель увидит её в уведомлении
        `access_request_rejected` и в `POST /access-requests/mine`. Заявка уже решена — `409 conflict`.
      operationId: rejectAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestReject'
            example:
              reason: Подрядчикам доступ не выдаём, обратитесь к руководителю проекта
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
              examples:
                AccessRequestRejected:
                  $ref: '#/components/examples/AccessRequestRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/invites:
    get:
      tags: [access]
      summary: Приглашения
      description: |
        Администратор и собственник, остальным — `403`. Все приглашения, новые первыми; `include_inactive=false`
        оставляет только действующие. Токена в списке нет — он показывается один раз при создании.
      operationId: listInvites
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Приглашения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
              example:
                - {id: 4, state: active, role: employee, department: {id: 3, name: Продажи}, full_name: Сергей Ким, created_by: {id: 2, full_name: Анна Ли, role: admin, department: null}, created_at: '2026-11-11T10:00:00+05:00', expires_at: '2026-11-18T10:00:00+05:00', max_uses: 1, used_count: 0, revoked_at: null}
                - {id: 3, state: exhausted, role: head, department: {id: 6, name: IT}, full_name: null, created_by: {id: 1, full_name: Ержан Касымов, role: owner, department: null}, created_at: '2026-11-09T12:00:00+05:00', expires_at: '2026-11-16T12:00:00+05:00', max_uses: 1, used_count: 1, revoked_at: null}
                - {id: 2, state: revoked, role: employee, department: null, full_name: null, created_by: {id: 2, full_name: Анна Ли, role: admin, department: null}, created_at: '2026-11-08T09:00:00+05:00', expires_at: '2026-11-15T09:00:00+05:00', max_uses: 10, used_count: 3, revoked_at: '2026-11-09T08:00:00+05:00'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [access]
      summary: Создать приглашение
      description: |
        Администратор и собственник. Роль кроме `owner`, срок по умолчанию 7 дней, использований по умолчанию 1.
        `token`, `bot_link` и `web_link` есть только в этом ответе: в базе хранится хеш токена.
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
            example:
              role: employee
              department_id: 3
              full_name: Сергей Ким
              expires_in_days: 7
              max_uses: 1
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
              example:
                id: 4
                state: active
                role: employee
                department: {id: 3, name: Продажи}
                full_name: Сергей Ким
                created_by: {id: 2, full_name: Анна Ли, role: admin, department: null}
                created_at: '2026-11-11T10:00:00+05:00'
                expires_at: '2026-11-18T10:00:00+05:00'
                max_uses: 1
                used_count: 0
                revoked_at: null
                token: Qm9sZC1pbnZpdGUtdG9rZW4tZXhhbXBsZQ
                bot_link: https://t.me/modus_feedback_bot?start=inv_Qm9sZC1pbnZpdGUtdG9rZW4tZXhhbXBsZQ
                web_link: https://modus.example.kz/invite/Qm9sZC1pbnZpdGUtdG9rZW4tZXhhbXBsZQ
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/invites/{invite_id}/revoke:
    parameters:
      - name: invite_id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [access]
      summary: Отозвать приглашение
      description: Администратор и собственник. Повторный отзыв ничего не меняет. Уже созданные по ссылке пользователи остаются.
      operationId: revokeInvite
      responses:
        '200':
          description: Приглашение отозвано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
              example:
                {id: 4, state: revoked, role: employee, department: {id: 3, name: Продажи}, full_name: Сергей Ким, created_by: {id: 2, full_name: Анна Ли, role: admin, department: null}, created_at: '2026-11-11T10:00:00+05:00', expires_at: '2026-11-18T10:00:00+05:00', max_uses: 1, used_count: 0, revoked_at: '2026-11-11T11:00:00+05:00'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии из `/auth/*`
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Сервисный ключ бота (только бот, из окружения)
    telegramId:
      type: apiKey
      in: header
      name: X-Telegram-Id
      description: Telegram ID пользователя, от имени которого действует бот (вместе с `X-Service-Key`)

  parameters:
    AppealId:
      name: appeal_id
      in: path
      required: true
      schema:
        type: integer
    DiscussionId:
      name: discussion_id
      in: path
      required: true
      schema:
        type: integer
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema:
        type: integer
    MeetingDraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: integer
    AccessRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    Session:
      description: Сессия выдана
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
          examples:
            employee:
              $ref: '#/components/examples/SessionEmployee'
    Unauthorized:
      description: Нет токена, токен истёк или неверный сервисный ключ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Требуется вход.
              details: null
    InvalidTelegramAuth:
      description: Подпись данных Telegram не прошла проверку или данные устарели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_telegram_auth
              message: Не удалось подтвердить вход через Telegram.
              details: null
    LoginForbidden:
      description: Пользователя нет в списке сотрудников (`user_not_registered`) или доступ отключён (`user_disabled`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_registered:
              value:
                error:
                  code: user_not_registered
                  message: Вас нет в списке сотрудников. Обратитесь к администратору.
                  details: null
            disabled:
              value:
                error:
                  code: user_disabled
                  message: Доступ отключён. Обратитесь к администратору.
                  details: null
    DevLoginDisabled:
      description: Dev-вход выключен настройкой окружения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: dev_login_disabled
              message: Dev-вход выключен.
              details: null
    UserDisabled:
      description: Доступ пользователя отключён (`user_disabled`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: user_disabled
              message: Доступ отключён. Обратитесь к администратору.
              details: null
    AlreadyRegistered:
      description: Этот Telegram-аккаунт уже есть в системе — нужно просто войти (`already_registered`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: already_registered
              message: Вы уже есть в системе. Войдите.
              details: null
    TooManyRequests:
      description: Слишком часто (`too_many_requests`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: too_many_requests
              message: Слишком много попыток. Подождите и попробуйте снова.
              details: null
    InviteInvalid:
      description: Приглашение просрочено, отозвано, исчерпано или не существует (`invite_invalid`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invite_invalid
              message: Приглашение недействительно. Подайте заявку на доступ.
              details: null
    Forbidden:
      description: Действие недоступно роли пользователя или обращение ему не видно
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия.
              details: null
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Обращение не найдено.
              details: null
    Conflict:
      description: Конфликт с текущим состоянием (`conflict`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: Обращение уже вынесено на обсуждение.
              details: null
    InvalidTransition:
      description: Недопустимый переход статуса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_transition
              message: Из статуса «Новое» нельзя перейти в «Реализовано».
              details:
                action: implement
                status: new
                allowed_actions: [take, reassign, send_message]
    ValidationError:
      description: Ошибка в данных запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите причину отказа.
              details:
                fields:
                  - {field: reason, message: Обязательное поле}
    VotingClosed:
      description: Срок обсуждения прошёл или итог зафиксирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: voting_closed
              message: Обсуждение завершено.
              details: null
    FileTooLarge:
      description: Файл больше допустимого
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: file_too_large
              message: Файл больше 20 МБ.
              details: {max_bytes: 20971520}
    MeetingFileTooLarge:
      description: Запись больше допустимого
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: file_too_large
              message: Запись больше 200 МБ.
              details: {max_bytes: 209715200}
    AiUnavailable:
      description: Claude или ElevenLabs недоступны — предложите заполнить форму
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ai_unavailable
              message: Разбор сейчас недоступен. Заполните обращение через форму.
              details: null

  schemas:
    # ------------------------------------------------ errors
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Текст для пользователя на русском
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: |
                Для `validation_error` — `{"fields": [{"field": "...", "message": "..."}]}`.
                Для `invalid_transition` — `{"action", "status", "allowed_actions"}`.
    ErrorCode:
      type: string
      description: |
        `unauthorized` 401 · `invalid_telegram_auth` 401 · `invalid_login_code` 401 · `invalid_credentials` 401 ·
        `invalid_bitrix_auth` 401 ·
        `user_not_registered` 403 · `user_disabled` 403 · `dev_login_disabled` 403 · `forbidden` 403 ·
        `access_request_pending` 403 · `access_request_rejected` 403 · `password_change_required` 403 ·
        `not_found` 404 · `conflict` 409 · `already_registered` 409 · `email_taken` 409 · `telegram_taken` 409 ·
        `last_login_method` 409 · `invite_invalid` 410 · `invalid_transition` 409 · `merge_not_allowed` 409 · `voting_closed` 409 ·
        `file_too_large` 413 · `validation_error` 422 · `audio_empty` 422 · `audio_too_long` 422 ·
        `too_many_requests` 429 ·
        `bitrix_unavailable` 502 · `ai_unavailable` 503 · `internal_error` 500
      enum:
        - unauthorized
        - invalid_telegram_auth
        - invalid_login_code
        - invalid_credentials
        - invalid_bitrix_auth
        - user_not_registered
        - user_disabled
        - dev_login_disabled
        - forbidden
        - access_request_pending
        - access_request_rejected
        - password_change_required
        - not_found
        - conflict
        - invalid_transition
        - already_registered
        - email_taken
        - telegram_taken
        - last_login_method
        - invite_invalid
        - merge_not_allowed
        - voting_closed
        - file_too_large
        - validation_error
        - audio_empty
        - audio_too_long
        - too_many_requests
        - bitrix_unavailable
        - ai_unavailable
        - internal_error

    # ------------------------------------------------ enums
    Role:
      type: string
      enum: [employee, head, admin, owner]
      description: employee — сотрудник, head — руководитель подразделения, admin — администратор, owner — собственник
    AppealType:
      type: string
      enum: [problem, suggestion, praise]
      description: problem — проблема, suggestion — предложение, praise — положительный отзыв
    Priority:
      type: string
      enum: [high, medium, low]
    AppealStatus:
      type: string
      enum: [new, in_review, awaiting_info, in_progress, implemented, rejected, closed]
      description: |
        new — Новое, in_review — На рассмотрении, awaiting_info — Ожидает уточнения, in_progress — В работе,
        implemented — Реализовано, rejected — Отклонено, closed — Закрыто
    AppealSource:
      type: string
      enum: [bot, form, meeting]
    AppealScope:
      type: string
      enum: [all, mine, assigned, department, unassigned]
      description: |
        all — всё видимое (по умолчанию); mine — я автор или участник; assigned — я ответственный;
        department — обращения моего подразделения (руководитель); unassigned — без ответственного (администратор)
    DueFilter:
      type: string
      enum: [overdue, due_today, due_week, no_deadline]
    DueState:
      type: string
      enum: [on_time, due_soon, overdue, answered, no_deadline]
      description: |
        on_time — срок не скоро; due_soon — меньше суток; overdue — просрочен;
        answered — первый ответ уже дан; no_deadline — срока нет (отзыв или нет ответственного)
    AppealAction:
      type: string
      enum:
        - take
        - request_info
        - reply_clarification
        - start_work
        - reject
        - implement
        - accept_feedback
        - merge
        - reassign
        - publish_discussion
        - create_bitrix_task
        - send_message
        - upload_attachment
        - nudge
    ViewerRelation:
      type: string
      enum: [author, participant, assignee, department_head, owner, admin]
    ClosedReason:
      type: string
      enum: [feedback_accepted, merged]
    DiscussionStatus:
      type: string
      enum: [open, closed]
    VoteValue:
      type: string
      enum: [for, against]
    NameConsent:
      type: string
      enum: [pending, shown, hidden]
    MeetingStatus:
      type: string
      enum: [processing, ready, failed]
    MeetingDraftStatus:
      type: string
      enum: [pending, confirmed, discarded]
    NotificationKind:
      type: string
      enum:
        - appeal_assigned
        - appeal_created
        - status_changed
        - clarification_requested
        - clarification_answered
        - message_received
        - deadline_reminder
        - escalation_head
        - nudge
        - appeal_merged
        - name_consent_request
        - discussion_closed
        - digest
        - access_request_created
        - access_request_approved
        - access_request_rejected
      description: |
        appeal_assigned — ответственному: новое назначение (в т. ч. переназначение);
        appeal_created — автору: номер, ответственный, срок;
        status_changed — автору и участникам; clarification_requested — автору: вопрос;
        clarification_answered — ответственному: ответ автора; message_received — новое сообщение в переписке;
        deadline_reminder — ответственному: срок истёк; escalation_head — руководителю: ответственный не ответил;
        nudge — ответственному: руководитель или собственник просит ответить по обращению;
        appeal_merged — автору повтора; name_consent_request — автору при выносе на обсуждение;
        discussion_closed — автору: итог обсуждения; digest — утренняя сводка;
        access_request_created — администраторам и собственнику: новая заявка на доступ (`path=/settings/access-requests`);
        access_request_approved — заявителю: доступ открыт, бот показывает меню и вход;
        access_request_rejected — заявителю: отказ с причиной (у получателя нет `user_id`)
    NotificationButtonType:
      type: string
      enum: [open_appeal, open_analytics, open_discussion, reply_clarification, name_consent_show, name_consent_hide, open_access_requests]

    # ------------------------------------------------ refs
    DepartmentRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    UserBrief:
      type: object
      required: [id, full_name, role, department]
      properties:
        id:
          type: integer
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
    AppealRef:
      type: object
      required: [id, number, summary, status, type]
      properties:
        id:
          type: integer
        number:
          type: string
          example: A-003
        summary:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AppealStatus'
        type:
          $ref: '#/components/schemas/AppealType'

    # ------------------------------------------------ auth / users
    MiniAppLoginRequest:
      type: object
      required: [init_data]
      properties:
        init_data:
          type: string
          description: '`Telegram.WebApp.initData` без изменений'
    TelegramWidgetLoginRequest:
      type: object
      required: [id, first_name, auth_date, hash]
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        photo_url:
          type: string
        auth_date:
          type: integer
        hash:
          type: string
    CodeLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    LoginCode:
      type: object
      required: [code, expires_at, ttl_seconds]
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
    User:
      type: object
      required: [id, telegram_id, full_name, position, role, department, is_absent, is_disabled]
      properties:
        id:
          type: integer
        telegram_id:
          type: integer
          format: int64
          nullable: true
          description: Только для администратора и для самого пользователя
        email:
          type: string
          nullable: true
          description: Рабочая почта для входа. Только для администратора и для самого пользователя
        bitrix_user_id:
          type: integer
          format: int64
          nullable: true
          description: |
            ID сотрудника на портале Битрикс24, если он входил через портал. Только для администратора
            и для самого пользователя
        has_password:
          type: boolean
          nullable: true
          description: |
            Задан ли пароль для входа по почте. Только для администратора и для самого пользователя,
            остальным — `null`. `false` — сбрасывать нечего: сотрудник входит через Telegram или Битрикс24
        full_name:
          type: string
        position:
          type: string
          nullable: true
          description: Должность, например «Сотрудник закупок»
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        is_absent:
          type: boolean
        is_disabled:
          type: boolean
    Permissions:
      type: object
      description: Что показывать в навигации. Права на конкретное обращение — в `Appeal.allowed_actions`.
      required:
        - can_create_appeal
        - can_process_appeals
        - can_view_department
        - can_view_all_appeals
        - analytics_scope
        - can_upload_meetings
        - can_manage_settings
        - can_view_unassigned
        - can_manage_access
      properties:
        can_create_appeal:
          type: boolean
        can_process_appeals:
          type: boolean
          description: Есть очередь назначенных (ответственный по категории или по обращению), руководитель или собственник
        can_view_department:
          type: boolean
        can_view_all_appeals:
          type: boolean
        analytics_scope:
          type: string
          enum: [none, department, company]
        can_upload_meetings:
          type: boolean
        can_manage_settings:
          type: boolean
        can_view_unassigned:
          type: boolean
        can_manage_access:
          type: boolean
          description: Заявки на доступ и приглашения — администратор и собственник
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [email, has_password, telegram_linked, switch_targets, responsible_for, deputy_for, assigned_open_count, permissions]
          properties:
            email:
              type: string
              nullable: true
              description: Почта для входа; null — задать в профиле (`PUT /me/credentials`)
            has_password:
              type: boolean
              description: Есть ли пароль; false — вход только через Telegram
            telegram_linked:
              type: boolean
              description: Привязан ли Telegram (вход в один клик и уведомления бота)
            switch_targets:
              type: array
              description: |
                Связанные аккаунты, на которые можно переключиться (`POST /auth/switch`): демо-переключатель ролей
                в шапке. Пусто — переключатель не показывать.
              items:
                $ref: '#/components/schemas/UserBrief'
            responsible_for:
              type: array
              description: Категории, где пользователь — ответственный
              items:
                $ref: '#/components/schemas/CategoryRef'
            deputy_for:
              type: array
              description: Категории, где пользователь — заместитель
              items:
                $ref: '#/components/schemas/CategoryRef'
            assigned_open_count:
              type: integer
              description: Открытых обращений, где пользователь — ответственный
            permissions:
              $ref: '#/components/schemas/Permissions'
    UserCreate:
      type: object
      required: [full_name, role]
      description: Нужен хотя бы один из `telegram_id` и `email`
      properties:
        telegram_id:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
          nullable: true
          maxLength: 254
        full_name:
          type: string
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        department_id:
          type: integer
          nullable: true
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        department_id:
          type: integer
          nullable: true
        is_absent:
          type: boolean
        is_disabled:
          type: boolean

    # ------------------------------------------------ org
    Department:
      type: object
      required: [id, name, head]
      properties:
        id:
          type: integer
        name:
          type: string
        head:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
    DepartmentWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        head_id:
          type: integer
          nullable: true
    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        head_id:
          type: integer
          nullable: true
    Category:
      type: object
      required: [id, name, department, responsible, deputy, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          $ref: '#/components/schemas/DepartmentRef'
        responsible:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        deputy:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        is_active:
          type: boolean
    CategoryWrite:
      type: object
      required: [name, department_id]
      properties:
        name:
          type: string
        department_id:
          type: integer
        responsible_id:
          type: integer
          nullable: true
        deputy_id:
          type: integer
          nullable: true
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        department_id:
          type: integer
        responsible_id:
          type: integer
          nullable: true
        deputy_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
    DeadlineRule:
      type: object
      required: [priority, business_days]
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        business_days:
          type: integer
          minimum: 1
          maximum: 30
    SystemSettings:
      type: object
      required: [digest_time, timezone]
      properties:
        digest_time:
          type: string
          example: '09:00'
          description: Время утренней сводки, ЧЧ:ММ по часовому поясу системы
        timezone:
          type: string
          example: '+05:00'
          description: Часовой пояс системы, задаётся окружением; только чтение

    # ------------------------------------------------ dictionaries
    LabeledCode:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    Dictionaries:
      type: object
      required: [appeal_types, priorities, statuses, roles, sources, actions, due_filters, timezone]
      properties:
        appeal_types:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        statuses:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/LabeledCode'
              - type: object
                required: [is_final]
                properties:
                  is_final:
                    type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        actions:
          type: array
          description: Подписи кнопок и справочная таблица переходов. Доступность — только по `Appeal.allowed_actions`.
          items:
            allOf:
              - $ref: '#/components/schemas/LabeledCode'
              - type: object
                required: [from, to]
                properties:
                  from:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppealStatus'
                  to:
                    type: string
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/AppealStatus'
        due_filters:
          type: array
          items:
            $ref: '#/components/schemas/LabeledCode'
        timezone:
          type: string

    # ------------------------------------------------ appeals
    AppealCreate:
      type: object
      required: [type, priority, text]
      properties:
        type:
          $ref: '#/components/schemas/AppealType'
        category_id:
          type: integer
          nullable: true
          description: null — категория не определена, обращение уходит в очередь администратора
        priority:
          $ref: '#/components/schemas/Priority'
        text:
          type: string
          minLength: 1
        summary:
          type: string
          nullable: true
          description: Краткая суть; если пусто — первые слова текста
        proposed_solution:
          type: string
          nullable: true
        source:
          type: string
          enum: [form, bot]
          default: form
        forwarded_from:
          type: string
          nullable: true
          description: Для пересылки в бот — откуда переслано (из `TextDraftRequest.forwarded_from`)
    AppealListItem:
      type: object
      required:
        - id
        - number
        - type
        - category
        - department
        - priority
        - status
        - summary
        - author
        - assignee
        - source
        - first_response_due_at
        - due_state
        - escalation_level
        - participants_count
        - merged_into
        - access
        - has_unread
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        number:
          type: string
          example: A-021
        type:
          $ref: '#/components/schemas/AppealType'
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
          description: Подразделение категории — по нему руководитель видит обращение
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/AppealStatus'
        summary:
          type: string
          nullable: true
        author:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: null для участника склеенного повтора (чужое имя скрыто)
        assignee:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: null — в очереди нераспределённых
        source:
          $ref: '#/components/schemas/AppealSource'
        first_response_due_at:
          type: string
          format: date-time
          nullable: true
          description: Срок первого ответа — единственный срок в системе. null у отзывов и нераспределённых.
        due_state:
          $ref: '#/components/schemas/DueState'
        escalation_level:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 — нет; 1 — напомнили ответственному; 2 — уведомили руководителя; 3 — «Зависло» в сводке собственника
        participants_count:
          type: integer
          description: Сколько человек сообщили о проблеме (автор + авторы присоединённых повторов)
        merged_into:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppealRef'
          description: Для повтора — основное обращение (его статус показывается автору повтора)
        access:
          type: string
          enum: [full, participant]
          description: participant — пользователь видит основное обращение только как участник склеенного повтора
        has_unread:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Appeal:
      allOf:
        - $ref: '#/components/schemas/AppealListItem'
        - type: object
          required:
            - text
            - proposed_solution
            - first_response_at
            - decision
            - rejection_reason
            - result
            - public_summary
            - public_result
            - forwarded_from
            - closed_reason
            - bitrix_task
            - discussion
            - attachments
            - viewer_relations
            - allowed_actions
          properties:
            text:
              type: string
              nullable: true
              description: null при access=participant
            proposed_solution:
              type: string
              nullable: true
            first_response_at:
              type: string
              format: date-time
              nullable: true
            decision:
              type: string
              nullable: true
              description: Принятое решение при переводе в работу
            rejection_reason:
              type: string
              nullable: true
            result:
              type: string
              nullable: true
              description: Зафиксированный результат («Реализовано»)
            public_summary:
              type: string
              nullable: true
              description: Что предложили — публичная формулировка для ленты реализованного
            public_result:
              type: string
              nullable: true
              description: Что сделали — публичная формулировка результата для ленты
            forwarded_from:
              type: string
              nullable: true
              description: Откуда переслано сообщение, если обращение подано пересылкой в бот
            closed_reason:
              type: string
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ClosedReason'
            bitrix_task:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/BitrixTask'
            discussion:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/DiscussionRef'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            viewer_relations:
              type: array
              description: Почему пользователь видит обращение
              items:
                $ref: '#/components/schemas/ViewerRelation'
            allowed_actions:
              type: array
              description: Действия, доступные пользователю сейчас. Клиент показывает только их.
              items:
                $ref: '#/components/schemas/AppealAction'
    AppealPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppealListItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    HistoryKind:
      type: string
      description: Вид события в истории обращения
      enum:
        - created
        - assigned
        - reassigned
        - status_changed
        - deadline_set
        - clarification_requested
        - clarification_answered
        - escalated
        - merged
        - participant_added
        - attachment_added
        - attachment_removed
        - nudged
        - discussion_published
        - discussion_closed
        - bitrix_task_created
        - field_changed
    WsAuth:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          enum: [auth]
        token:
          type: string
          description: '`access_token` сессии из `/auth/*`'
      example: {type: auth, token: 3fa1c0d2e4b54f6c8a7e9d0b1c2f3a4e}
    WsPing:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ping]
      example: {type: ping}
    WsClientMessage:
      description: Сообщение клиента серверу
      oneOf:
        - $ref: '#/components/schemas/WsAuth'
        - $ref: '#/components/schemas/WsPing'
      discriminator:
        propertyName: type
        mapping:
          auth: '#/components/schemas/WsAuth'
          ping: '#/components/schemas/WsPing'
    WsReady:
      type: object
      description: Вход принят, дальше идут события
      required: [type, user_id, unread_count, session_expires_at]
      properties:
        type:
          type: string
          enum: [ready]
        user_id:
          type: integer
        unread_count:
          type: integer
          minimum: 0
          description: Непрочитанные уведомления на момент подключения (то же, что `GET /notifications/unread-count`)
        session_expires_at:
          type: string
          format: date-time
          description: Когда сессия истечёт и сервер закроет соединение с кодом `4401`
      example: {type: ready, user_id: 4, unread_count: 2, session_expires_at: '2026-12-12T09:00:00+05:00'}
    WsPong:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [pong]
      example: {type: pong}
    WsAppealCreated:
      type: object
      required: [type, appeal_id, number, status]
      properties:
        type:
          type: string
          enum: [appeal.created]
        appeal_id:
          type: integer
        number:
          type: string
        status:
          $ref: '#/components/schemas/AppealStatus'
      example: {type: appeal.created, appeal_id: 42, number: A-042, status: new}
    WsAppealUpdated:
      type: object
      required: [type, appeal_id, number, status, changed]
      properties:
        type:
          type: string
          enum: [appeal.updated]
        appeal_id:
          type: integer
        number:
          type: string
        status:
          allOf:
            - $ref: '#/components/schemas/AppealStatus'
          description: Статус после изменения
        changed:
          type: array
          minItems: 1
          description: |
            Что записано в историю этим действием — те же значения, что `HistoryEvent.kind`:
            `status_changed` — статус, `assigned` / `reassigned` — ответственный, `deadline_set` — срок,
            `escalated` — эскалация, `attachment_added` — вложение и т. д. Подсказка, что перезапросить.
          items:
            $ref: '#/components/schemas/HistoryKind'
      example: {type: appeal.updated, appeal_id: 42, number: A-042, status: in_review, changed: [status_changed]}
    WsMessageCreated:
      type: object
      required: [type, appeal_id, message_id]
      properties:
        type:
          type: string
          enum: [message.created]
        appeal_id:
          type: integer
        message_id:
          type: integer
      example: {type: message.created, appeal_id: 42, message_id: 318}
    WsNotificationCreated:
      type: object
      required: [type, notification_id, unread_count]
      properties:
        type:
          type: string
          enum: [notification.created]
        notification_id:
          type: integer
        unread_count:
          type: integer
          minimum: 0
          description: Счётчик непрочитанного вместе с этим уведомлением
      example: {type: notification.created, notification_id: 905, unread_count: 3}
    WsDiscussionUpdated:
      type: object
      required: [type, discussion_id, changed]
      properties:
        type:
          type: string
          enum: [discussion.updated]
        discussion_id:
          type: integer
        changed:
          type: string
          enum: [published, vote, comment, name_consent, closed]
          description: |
            `published` — обсуждение появилось в ленте, `vote` — изменились итоги голосования,
            `comment` — новый комментарий, `name_consent` — автор показал или скрыл имя, `closed` — зафиксирован итог
      example: {type: discussion.updated, discussion_id: 6, changed: vote}
    WsEvent:
      description: Событие об изменении
      oneOf:
        - $ref: '#/components/schemas/WsAppealCreated'
        - $ref: '#/components/schemas/WsAppealUpdated'
        - $ref: '#/components/schemas/WsMessageCreated'
        - $ref: '#/components/schemas/WsNotificationCreated'
        - $ref: '#/components/schemas/WsDiscussionUpdated'
      discriminator:
        propertyName: type
        mapping:
          appeal.created: '#/components/schemas/WsAppealCreated'
          appeal.updated: '#/components/schemas/WsAppealUpdated'
          message.created: '#/components/schemas/WsMessageCreated'
          notification.created: '#/components/schemas/WsNotificationCreated'
          discussion.updated: '#/components/schemas/WsDiscussionUpdated'
    WsServerMessage:
      description: Сообщение сервера клиенту
      oneOf:
        - $ref: '#/components/schemas/WsReady'
        - $ref: '#/components/schemas/WsPong'
        - $ref: '#/components/schemas/WsEvent'
    HistoryEvent:
      type: object
      required: [id, appeal_id, kind, actor, field, old_value, new_value, comment, created_at]
      properties:
        id:
          type: integer
        appeal_id:
          type: integer
        kind:
          $ref: '#/components/schemas/HistoryKind'
        actor:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: null — система
        field:
          type: string
          nullable: true
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
          description: Причина переназначения, текст решения и т. п. У первого назначения без причины — null
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, appeal_id, author, text, is_clarification_question, created_at]
      properties:
        id:
          type: integer
        appeal_id:
          type: integer
        author:
          $ref: '#/components/schemas/UserBrief'
        text:
          type: string
        is_clarification_question:
          type: boolean
        created_at:
          type: string
          format: date-time
    Attachment:
      type: object
      required: [id, appeal_id, filename, content_type, size_bytes, download_url, preview_url, can_delete, uploaded_by, created_at]
      properties:
        id:
          type: integer
        appeal_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        download_url:
          type: string
          description: Путь от корня сервера (`/api/v1/attachments/{id}`), требует авторизации
        preview_url:
          type: string
          nullable: true
          description: |
            Уменьшенная копия картинки (`/api/v1/attachments/{id}?preview=1`), требует авторизации.
            `null` — файл не картинка, показывать значок
        can_delete:
          type: boolean
          description: Может ли текущий пользователь удалить файл сейчас (`DELETE /attachments/{id}`)
        uploaded_by:
          $ref: '#/components/schemas/UserBrief'
        created_at:
          type: string
          format: date-time
    DuplicateSuggestion:
      type: object
      required: [id, appeal_id, similar_appeal, explanation, can_merge, created_at]
      properties:
        id:
          type: integer
        appeal_id:
          type: integer
        similar_appeal:
          $ref: '#/components/schemas/AppealRef'
        explanation:
          type: string
          description: Объяснение сходства от Claude
        can_merge:
          type: boolean
          description: Можно ли склеить сейчас (статусы и права); кнопку «Присоединить» показывать только при true
        created_at:
          type: string
          format: date-time
    BitrixTask:
      type: object
      required: [task_id, url, created_at]
      properties:
        task_id:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time

    # ------------------------------------------------ drafts
    TextDraftRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        forwarded_from:
          type: string
          nullable: true
          description: Откуда переслано сообщение (название чата или имя), если это пересылка
    AppealDraft:
      type: object
      description: Черновик для правки и подтверждения. Не хранится на сервере.
      required: [type, category, priority, summary, text, proposed_solution, transcript]
      properties:
        type:
          $ref: '#/components/schemas/AppealType'
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
        priority:
          $ref: '#/components/schemas/Priority'
        summary:
          type: string
        text:
          type: string
          description: Текст обращения (для голоса — расшифровка)
        proposed_solution:
          type: string
          nullable: true
        transcript:
          type: string
          nullable: true
          description: Расшифровка голосового; null для текста

    # ------------------------------------------------ discussions
    DiscussionCreate:
      type: object
      required: [public_text, deadline]
      properties:
        public_text:
          type: string
          minLength: 1
          description: Публичная формулировка вопроса
        deadline:
          type: string
          format: date-time
    DiscussionRef:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/DiscussionStatus'
    Discussion:
      type: object
      required:
        - id
        - appeal
        - public_text
        - deadline
        - status
        - author_name_consent
        - author_display
        - department
        - votes_for
        - votes_against
        - my_vote
        - comments_count
        - outcome
        - created_by
        - created_at
        - closed_at
        - can_vote
        - can_close
        - can_set_name_consent
      properties:
        id:
          type: integer
        appeal:
          type: object
          required: [id, number, type, status]
          description: Публичная ссылка на обращение; текст и переписка не раскрываются
          properties:
            id:
              type: integer
            number:
              type: string
            type:
              $ref: '#/components/schemas/AppealType'
            status:
              $ref: '#/components/schemas/AppealStatus'
        public_text:
          type: string
        deadline:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/DiscussionStatus'
        author_name_consent:
          $ref: '#/components/schemas/NameConsent'
        author_display:
          type: string
          description: Имя автора при согласии, иначе «Отдел «…»»
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        votes_for:
          type: integer
        votes_against:
          type: integer
        my_vote:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VoteValue'
        comments_count:
          type: integer
        outcome:
          type: string
          nullable: true
        created_by:
          $ref: '#/components/schemas/UserBrief'
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        can_vote:
          type: boolean
        can_close:
          type: boolean
        can_set_name_consent:
          type: boolean
          description: true только автору обращения
    DiscussionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Discussion'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    DiscussionComment:
      type: object
      required: [id, discussion_id, author, text, created_at]
      properties:
        id:
          type: integer
        discussion_id:
          type: integer
        author:
          $ref: '#/components/schemas/UserBrief'
        text:
          type: string
        created_at:
          type: string
          format: date-time
    FeedItem:
      type: object
      required: [appeal_id, number, type, category, department, public_summary, result, author_display, implemented_at, discussion_id]
      properties:
        appeal_id:
          type: integer
        number:
          type: string
        type:
          $ref: '#/components/schemas/AppealType'
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        public_summary:
          type: string
          description: Что предложили
        result:
          type: string
          description: Что сделали — `public_result` обращения, а если он не задан — `result`
        author_display:
          type: string
          description: Имя автора при согласии, иначе подразделение
        implemented_at:
          type: string
          format: date-time
        discussion_id:
          type: integer
          nullable: true
    FeedPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ------------------------------------------------ meetings
    MeetingBrief:
      type: object
      required: [id, title, status, drafts_total, drafts_pending, uploaded_by, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/MeetingStatus'
        drafts_total:
          type: integer
        drafts_pending:
          type: integer
        uploaded_by:
          $ref: '#/components/schemas/UserBrief'
        created_at:
          type: string
          format: date-time
    Meeting:
      type: object
      required: [id, title, status, error, transcript, uploaded_by, drafts, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/MeetingStatus'
        error:
          type: string
          nullable: true
          description: Текст ошибки для пользователя при status=failed
        transcript:
          type: string
          nullable: true
        uploaded_by:
          $ref: '#/components/schemas/UserBrief'
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/MeetingDraft'
        created_at:
          type: string
          format: date-time
    MeetingDraft:
      type: object
      required: [id, meeting_id, status, type, category, priority, summary, text, proposed_solution, quote, author, appeal]
      properties:
        id:
          type: integer
        meeting_id:
          type: integer
        status:
          $ref: '#/components/schemas/MeetingDraftStatus'
        type:
          $ref: '#/components/schemas/AppealType'
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
        priority:
          $ref: '#/components/schemas/Priority'
        summary:
          type: string
        text:
          type: string
        proposed_solution:
          type: string
          nullable: true
        quote:
          type: string
          description: Цитата из расшифровки, на которой основан черновик
        author:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
          description: Сотрудник-автор; null — автором станет загрузивший
        appeal:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppealRef'
          description: Созданное обращение после подтверждения
    MeetingDraftUpdate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AppealType'
        category_id:
          type: integer
          nullable: true
        priority:
          $ref: '#/components/schemas/Priority'
        summary:
          type: string
        text:
          type: string
        proposed_solution:
          type: string
          nullable: true
        author_id:
          type: integer
          nullable: true

    # ------------------------------------------------ analytics
    CountByType:
      type: object
      required: [type, count]
      properties:
        type:
          $ref: '#/components/schemas/AppealType'
        count:
          type: integer
    CountByCategory:
      type: object
      required: [category, count]
      properties:
        category:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
          description: null — без категории
        count:
          type: integer
    CountByStatus:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: '#/components/schemas/AppealStatus'
        count:
          type: integer
    StuckAppeal:
      type: object
      required: [appeal, assignee, days_overdue, escalation_level]
      properties:
        appeal:
          $ref: '#/components/schemas/AppealRef'
        assignee:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        days_overdue:
          type: integer
          description: Рабочих дней просрочки
        escalation_level:
          type: integer
    RepeatedTopic:
      type: object
      required: [appeal, participants_count]
      properties:
        appeal:
          $ref: '#/components/schemas/AppealRef'
        participants_count:
          type: integer
          minimum: 2
          description: |
            Сколько раз об этом сообщили: основное обращение плюс присоединённые повторы. Повторы одного и того же
            автора тоже считаются. Темы идут по убыванию этого числа.
    DepartmentStats:
      type: object
      required: [department, total, open_count, overdue_count, avg_first_response_hours]
      properties:
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        total:
          type: integer
        open_count:
          type: integer
          description: Незавершённые
        overdue_count:
          type: integer
          description: С просроченным сроком первого ответа сейчас
        avg_first_response_hours:
          type: number
          nullable: true
          description: Среднее время первого ответа в часах; null — ответов ещё не было
    PeriodStats:
      type: object
      description: Ключевые цифры выборки за семь дней; момент `to` входит в период, момент `from` — нет
      required: [from, to, created_count, closed_count, implemented_count, overdue_count, avg_first_response_hours]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        created_count:
          type: integer
          description: Подано за период
        closed_count:
          type: integer
          description: Завершено за период (отклонено, реализовано, закрыто)
        implemented_count:
          type: integer
          description: Из них реализовано
        overdue_count:
          type: integer
          description: Срок первого ответа истёк в этом периоде, а ответа к сроку не было
        avg_first_response_hours:
          type: number
          nullable: true
          description: Среднее время первого ответа по ответам, данным в этом периоде; null — ответов не было
    AnalyticsSummary:
      type: object
      required:
        - scope
        - department
        - generated_at
        - total
        - closed_count
        - closed_share
        - avg_first_response_hours
        - by_type
        - by_category
        - by_status
        - new_last_24h
        - stuck
        - closed_last_week
        - repeated_topics
        - overdue
        - assignee_load
        - unassigned_count
        - by_department
        - last_week
        - previous_week
      properties:
        by_department:
          type: array
          description: |
            Выборка по подразделениям исполнителя: подразделение категории обращения, а у обращения без категории —
            подразделение ответственного (`department: null` — нет ни того, ни другого). Не подразделение автора.
            Сначала подразделения с наибольшим числом просроченных. Фильтр `department_id` работает так же —
            по подразделению категории.
          items:
            $ref: '#/components/schemas/DepartmentStats'
        last_week:
          allOf:
            - $ref: '#/components/schemas/PeriodStats'
          description: Последние семь дней до `generated_at`
        previous_week:
          allOf:
            - $ref: '#/components/schemas/PeriodStats'
          description: Семь дней перед ними — для сравнения
        scope:
          type: string
          enum: [company, department]
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        generated_at:
          type: string
          format: date-time
        total:
          type: integer
        closed_count:
          type: integer
          description: В финальных статусах (implemented, rejected, closed)
        closed_share:
          type: number
          format: float
          minimum: 0
          maximum: 1
        avg_first_response_hours:
          type: number
          format: float
          nullable: true
          description: Среднее время от создания до первого ответа, часы; null — нет данных
        by_type:
          type: array
          items:
            $ref: '#/components/schemas/CountByType'
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CountByCategory'
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/CountByStatus'
        new_last_24h:
          type: array
          items:
            $ref: '#/components/schemas/AppealRef'
        stuck:
          type: array
          description: Зависшие — шаг эскалации 3
          items:
            $ref: '#/components/schemas/StuckAppeal'
        closed_last_week:
          type: array
          items:
            $ref: '#/components/schemas/AppealRef'
        repeated_topics:
          type: array
          description: Обращения, к которым присоединены повторы, по убыванию числа сообщивших
          items:
            $ref: '#/components/schemas/RepeatedTopic'
        overdue:
          type: array
          description: Все с просроченным сроком первого ответа
          items:
            $ref: '#/components/schemas/StuckAppeal'
        assignee_load:
          type: array
          description: Нагрузка по ответственным в выборке (история 53), по убыванию открытых
          items:
            $ref: '#/components/schemas/AssigneeLoad'
        unassigned_count:
          type: integer
          description: Открытых обращений без ответственного в выборке
    AssigneeLoad:
      type: object
      required: [assignee, open_count, overdue_count, avg_first_response_hours]
      properties:
        assignee:
          $ref: '#/components/schemas/UserBrief'
        open_count:
          type: integer
          description: Открытых обращений (не в финальном статусе)
        overdue_count:
          type: integer
          description: Из них с просроченным сроком первого ответа
        avg_first_response_hours:
          type: number
          format: float
          nullable: true
    Digest:
      type: object
      required: [scope, department, generated_at, text]
      properties:
        scope:
          type: string
          enum: [company, department]
        department:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        generated_at:
          type: string
          format: date-time
        text:
          type: string
          description: Готовый текст для Telegram, `parse_mode=HTML`

    # ------------------------------------------------ notifications
    NotificationButton:
      type: object
      required: [type, text, appeal_id, discussion_id]
      properties:
        type:
          $ref: '#/components/schemas/NotificationButtonType'
        text:
          type: string
        appeal_id:
          type: integer
          nullable: true
        discussion_id:
          type: integer
          nullable: true
    Notification:
      type: object
      required: [id, kind, text, appeal, path, buttons, is_read, created_at]
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/NotificationKind'
        text:
          type: string
          description: Текст для Telegram (`parse_mode=HTML`) и для списка в клиенте
        appeal:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppealRef'
        path:
          type: string
          nullable: true
          description: |
            Маршрут клиента: `/appeals/{id}`, `/discussions/{id}`, `/analytics`. Бот передаёт его в Mini App
            через `startapp` (`/appeals/21` → `appeals_21`).
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/NotificationButton'
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    BotNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          required: [recipient, attempts]
          properties:
            recipient:
              type: object
              required: [user_id, telegram_id]
              properties:
                user_id:
                  type: integer
                  nullable: true
                  description: '`null` — получатель ещё не пользователь (отказ по заявке на доступ)'
                telegram_id:
                  type: integer
                  format: int64
            attempts:
              type: integer
              description: Сколько раз бот уже пытался доставить
    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    MarkReadRequest:
      type: object
      properties:
        all:
          type: boolean
        appeal_id:
          type: integer
        ids:
          type: array
          items:
            type: integer

    # ------------------------------------------------ access requests / invites
    AssignableRole:
      type: string
      enum: [employee, head, admin]
      description: Роль, которую можно выдать по заявке или приглашению — любая, кроме `owner`
    AccessRequestStatus:
      type: string
      enum: [pending, approved, rejected]
      description: pending — на рассмотрении, approved — одобрена, rejected — отклонена
    TelegramIdentity:
      type: object
      description: |
        Кто обращается без сессии. Бот передаёт заголовки `X-Service-Key` и `X-Telegram-Id` и пустое тело;
        Mini App — `init_data`; веб — `telegram_login`. Указать можно только одно из двух полей.
      properties:
        init_data:
          type: string
          description: '`Telegram.WebApp.initData` без изменений'
        telegram_login:
          $ref: '#/components/schemas/TelegramWidgetLoginRequest'
    AccessRequestSubmit:
      allOf:
        - $ref: '#/components/schemas/TelegramIdentity'
        - type: object
          required: [full_name]
          properties:
            full_name:
              type: string
              minLength: 1
              maxLength: 120
              description: По умолчанию клиент подставляет имя из профиля Telegram
            department_id:
              type: integer
              nullable: true
              description: Из `GET /access-requests/departments`
            comment:
              type: string
              nullable: true
              maxLength: 500
              description: Должность или комментарий
            telegram_username:
              type: string
              nullable: true
              maxLength: 64
              description: Только бот (ник из профиля). Mini App и веб — ник берётся из подписанных данных
    AccessRequest:
      type: object
      required:
        - id
        - status
        - full_name
        - email
        - telegram_username
        - department
        - comment
        - created_at
        - updated_at
        - assigned_role
        - assigned_department
        - decided_by
        - decided_at
        - reject_reason
        - user_id
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        full_name:
          type: string
        email:
          type: string
          nullable: true
          description: Почта, если заявка подана регистрацией по почте; иначе заявка из Telegram
        telegram_username:
          type: string
          nullable: true
        department:
          type: object
          nullable: true
          description: Подразделение, которое выбрал заявитель
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assigned_role:
          type: string
          nullable: true
          enum: [employee, head, admin]
          description: Роль, выданная при одобрении
        assigned_department:
          type: object
          nullable: true
          description: Подразделение, назначенное при одобрении
          allOf:
            - $ref: '#/components/schemas/DepartmentRef'
        decided_by:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserBrief'
        decided_at:
          type: string
          format: date-time
          nullable: true
        reject_reason:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true
          description: Созданный пользователь (после одобрения)
    AccessRequestPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AccessStatus:
      type: object
      required: [state, request]
      properties:
        state:
          type: string
          enum: [none, pending, rejected, registered, disabled]
          description: |
            none — заявки нет, показать форму; pending — на рассмотрении; rejected — последняя заявка отклонена
            (можно подать новую); registered — пользователь заведён, нужно войти; disabled — доступ отключён
        request:
          type: object
          nullable: true
          description: Последняя заявка аккаунта
          allOf:
            - $ref: '#/components/schemas/AccessRequest'
    AccessRequestApprove:
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRole'
          default: employee
        department_id:
          type: integer
          nullable: true
          description: Не передано — подразделение из заявки
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Не передано — имя из заявки
        position:
          type: string
          nullable: true
          maxLength: 120
    AccessRequestReject:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
    InviteState:
      type: string
      enum: [active, expired, revoked, exhausted]
      description: active — действует; expired — истёк срок; revoked — отозвано; exhausted — использования кончились
    Invite:
      type: object
      required: [id, state, role, department, full_name, created_by, created_at, expires_at, max_uses, used_count, revoked_at]
      properties:
        id:
          type: integer
        state:
          $ref: '#/components/schemas/InviteState'
        role:
          $ref: '#/components/schemas/AssignableRole'
        department:
          type: object
          nullable: true
