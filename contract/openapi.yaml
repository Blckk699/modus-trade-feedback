openapi: 3.0.3
info:
  title: Модус Трейд — обращения и предложения сотрудников
  version: 1.0.0
  description: |
    Контракт API бэкенда. Источник истины для клиентов: веб, Mini App, Flutter, бот.
    Спека продукта — `SPEC.md`, правила работы с контрактом — `contract/README.md`.

    ## Общие правила

    - Все маршруты под префиксом `/api/v1` (он уже входит в пути контракта; базовый адрес клиента — хост без префикса).
    - Время — ISO 8601 со смещением. Часовой пояс системы UTC+5, сервер отдаёт время со смещением `+05:00`.
    - Коды перечислений (статусы, типы, роли) — латиница; подписи на русском отдаёт `GET /dictionaries`.
    - Клиент не дублирует правила прав и переходов: у обращения есть `allowed_actions`, у пользователя — `permissions`.
      Действие, которого нет в этих списках, клиент не показывает.
    - Ошибка всегда в формате `Error`: `{"error": {"code": "...", "message": "...", "details": ...}}`.
      `message` можно показывать пользователю как есть, ветвиться — только по `code`.

    ## Авторизация

    - Пользователь: `Authorization: Bearer <access_token>`. Токен выдают маршруты `/auth/*`:
      почта и пароль (основной вход в вебе и мобильном приложении), Mini App, Telegram Login,
      одноразовый код из бота, dev-вход. Telegram — вход в один клик, привязывается к аккаунту (`/me/telegram`).
      Вход через Битрикс24 (`/auth/bitrix/*`) — если включён на сервере (`GET /auth/methods`).
    - Бот: `X-Service-Key: <ключ бота>` и `X-Telegram-Id: <Telegram ID пользователя>` — бот действует от имени
      пользователя, права проверяются так же, как для самого пользователя. Так бот вызывает любые
      пользовательские маршруты. Маршруты `/bot/*` требуют только `X-Service-Key`.
    - Незаведённый пользователь получает `403 user_not_registered`, отключённый — `403 user_disabled`.

    ## Жизненный цикл обращения

    | Действие (`allowed_actions`) | Маршрут | Из статуса | В статус |
    |---|---|---|---|
    | `take` | `POST /appeals/{id}/take` | `new` | `in_review` |
    | `request_info` | `POST /appeals/{id}/request-info` | `in_review` | `awaiting_info` |
    | `reply_clarification` | `POST /appeals/{id}/messages` (автор) | `awaiting_info` | `in_review` |
    | `start_work` | `POST /appeals/{id}/start-work` | `in_review` | `in_progress` |
    | `reject` | `POST /appeals/{id}/reject` | `in_review` | `rejected` |
    | `implement` | `POST /appeals/{id}/implement` | `in_progress` | `implemented` |
    | `accept_feedback` | `POST /appeals/{id}/accept-feedback` | `new` (только отзыв) | `closed` |
    | `merge` | `POST /appeals/{id}/merge` | `new`, `in_review` | `closed` |

    Любой другой переход — `409 invalid_transition`. Отказ без причины, «В работу» без решения и
    «Реализовано» без результата — `422 validation_error`.

    **Кто выполняет действия.** Действия жизненного цикла выполняют ответственный обращения, руководитель
    подразделения обращения и собственник. Руководитель и собственник действуют без смены ответственного:
    для смены есть `reassign`. Администратор видит все обращения, но не меняет статусы, не склеивает,
    не выносит на обсуждение, не создаёт задачи в Битрикс24 и не видит приватную переписку (`403`).
    Автор пишет в переписку и отвечает на уточняющий вопрос.

    **Срок.** В системе один срок — срок первого ответа. Он назначается при маршрутизации и при переназначении,
    первый ответ фиксирует `take` (или `accept_feedback` у отзыва). Уточняющий вопрос задаётся уже после
    первого ответа и на срок не влияет.
servers:
  - url: http://localhost:4010
    description: Мок-сервер (Prism, без состояния)
  - url: http://localhost:8000
    description: Локальный бэкенд
tags:
  - name: system
    description: Служебное
  - name: auth
    description: Вход и сессия
  - name: me
    description: Текущий пользователь
  - name: dictionaries
    description: Справочники
  - name: appeals
    description: Обращения
  - name: appeal-actions
    description: Смена статуса, переназначение, склейка
  - name: messages
    description: Приватная переписка по обращению
  - name: attachments
    description: Вложения
  - name: duplicates
    description: Подсказки о повторах
  - name: drafts
    description: Черновик обращения из текста и голоса (Claude, ElevenLabs)
  - name: discussions
    description: Общие обсуждения
  - name: feed
    description: Лента реализованного
  - name: bitrix
    description: Битрикс24
  - name: meetings
    description: Режим «совещание»
  - name: analytics
    description: Сводка и аналитика
  - name: notifications
    description: Уведомления и счётчик непрочитанного
  - name: live
    description: Живые обновления по WebSocket
  - name: bot
    description: Служебные маршруты бота
  - name: admin
    description: Настройки администратора
  - name: access
    description: Заявки на доступ и приглашения
security:
  - bearerAuth: []
  - serviceKey: []
    telegramId: []

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Проверка живости
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  # ---------------------------------------------------------------- auth
  /api/v1/auth/telegram/mini-app:
    post:
      tags: [auth]
      summary: Вход из Mini App по initData
      description: Бэкенд проверяет подпись `initData` токеном бота и выдаёт сессию.
      operationId: loginMiniApp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniAppLoginRequest'
            example:
              init_data: 'query_id=AAH...&user=%7B%22id%22%3A100000004%7D&auth_date=1794300000&hash=3f2a...'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/telegram/widget:
    post:
      tags: [auth]
      summary: Вход через Telegram Login в вебе
      description: Тело — поля, которые виджет Telegram Login передаёт в колбэк, без изменений.
      operationId: loginTelegramWidget
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWidgetLoginRequest'
            example:
              id: 100000004
              first_name: Айгерим
              last_name: Нурланова
              username: aigerim_demo
              auth_date: 1794300000
              hash: 9b1c0e7d4a...
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/code:
    post:
      tags: [auth]
      summary: Вход в мобильное приложение по одноразовому коду из бота
      description: |
        Код обменивается на сессию один раз и истекает через `ttl_seconds` после выдачи.
        Защита от перебора: после 5 неудачных попыток с одного адреса за 15 минут — `429 too_many_requests`
        (адрес клиента берётся из `X-Forwarded-For` только от доверенного прокси). При массовом переборе
        со многих адресов активные коды сжигаются — пользователь запрашивает новый в боте.
      operationId: loginWithCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLoginRequest'
            example:
              code: '482913'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          description: Код неверный, уже использован или истёк (`invalid_login_code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_login_code
                  message: Код неверный или истёк. Запросите новый код в боте.
                  details: null
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Слишком много неудачных попыток с этого адреса (`too_many_requests`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: too_many_requests
                  message: Слишком много неудачных попыток. Подождите и попробуйте снова.
                  details: null
  /api/v1/auth/login-codes:
    post:
      tags: [auth, bot]
      summary: Выдать одноразовый код входа (только бот)
      description: |
        Бот вызывает с `X-Service-Key` и `X-Telegram-Id` пользователя и показывает код в чате.
        Пользователь вводит код в мобильном приложении (`POST /auth/code`).
      operationId: issueLoginCode
      security:
        - serviceKey: []
          telegramId: []
      responses:
        '201':
          description: Код выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCode'
              example:
                code: '482913'
                expires_at: '2026-11-10T19:35:00+05:00'
                ttl_seconds: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'
  /api/v1/auth/dev/users:
    get:
      tags: [auth]
      summary: Список пользователей для dev-входа
      description: Работает только при `DEV_LOGIN_ENABLED=true`. На сервере для демо выключен — `403 dev_login_disabled`.
      operationId: listDevUsers
      security: []
      responses:
        '200':
          description: Пользователи, под которыми можно войти
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBrief'
              example:
                - {id: 1, full_name: Ержан Касымов, role: owner, department: null}
                - {id: 2, full_name: Анна Ли, role: admin, department: null}
                - {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                - {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                - {id: 6, full_name: Дина Жуматова, role: employee, department: {id: 2, name: Бухгалтерия}}
                - {id: 13, full_name: Даурен Исаев, role: employee, department: {id: 6, name: IT}}
        '403':
          $ref: '#/components/responses/DevLoginDisabled'
  /api/v1/auth/dev/login:
    post:
      tags: [auth]
      summary: Dev-вход под выбранным пользователем
      description: Работает только при `DEV_LOGIN_ENABLED=true`, иначе `403 dev_login_disabled`.
      operationId: devLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
            example:
              user_id: 4
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '403':
          $ref: '#/components/responses/DevLoginDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выход, токен становится недействительным
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сессия закрыта
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Регистрация по рабочей почте и паролю
      description: |
        Без `invite_token` — заявка на доступ (`status=pending`), как заявка из Telegram: те же уведомления
        администратору и собственнику, войти до одобрения нельзя. Повторная регистрация с той же почтой,
        пока заявка на рассмотрении, обновляет её (`200`).
        С действующим `invite_token` — сразу пользователь с ролью и подразделением приглашения и сессия (`201`).
        Почта уникальна без учёта регистра и не подтверждается письмом. Пароль — от 8 символов, хранится только хешем.
      operationId: registerByEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegister'
            examples:
              request:
                summary: Заявка на доступ
                value:
                  full_name: Сергей Ким
                  email: s.kim@modus.example
                  password: korova-2026
                  department_id: 3
                  comment: Менеджер по продажам
              invite:
                summary: По приглашению
                value:
                  full_name: Сергей Ким
                  email: s.kim@modus.example
                  password: korova-2026
                  invite_token: 3q2-7Hk_LmN0pQrStUvWxYz9aBcDeFg
      responses:
        '200':
          description: Заявка на рассмотрении обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
              example:
                status: pending
                request: {id: 9, status: pending, full_name: Сергей Ким, email: s.kim@modus.example, telegram_username: null, department: {id: 3, name: Продажи}, comment: Менеджер по продажам, created_at: '2026-11-12T16:20:00+05:00', updated_at: '2026-11-12T16:25:00+05:00', assigned_role: null, assigned_department: null, decided_by: null, decided_at: null, reject_reason: null, user_id: null}
                session: null
        '201':
          description: Заявка подана (`pending`) или пользователь создан по приглашению (`registered`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
              examples:
                pending:
                  summary: Заявка подана
                  value:
                    status: pending
                    request: {id: 9, status: pending, full_name: Сергей Ким, email: s.kim@modus.example, telegram_username: null, department: {id: 3, name: Продажи}, comment: Менеджер по продажам, created_at: '2026-11-12T16:20:00+05:00', updated_at: '2026-11-12T16:20:00+05:00', assigned_role: null, assigned_department: null, decided_by: null, decided_at: null, reject_reason: null, user_id: null}
                    session: null
                registered:
                  summary: По приглашению — сразу вход
                  value:
                    status: registered
                    request: null
                    session:
                      access_token: mt_sess_8f1c2d3e4b5a69788796a5b4c3d2e1f0
                      token_type: bearer
                      expires_at: '2026-12-12T16:20:00+05:00'
                      user:
                        id: 21
                        telegram_id: null
                        email: s.kim@modus.example
                        has_password: true
                        telegram_linked: false
                        switch_targets: []
                        full_name: Сергей Ким
                        position: null
                        role: employee
                        department: {id: 3, name: Продажи}
                        is_absent: false
                        is_disabled: false
                        responsible_for: []
                        deputy_for: []
                        assigned_open_count: 0
                        permissions: {can_create_appeal: true, can_process_appeals: false, can_view_department: false, can_view_all_appeals: false, analytics_scope: none, can_upload_meetings: false, can_manage_settings: false, can_view_unassigned: false, can_manage_access: false}
        '409':
          description: Почта уже принадлежит сотруднику (`email_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: email_taken
                  message: Эта почта уже зарегистрирована. Войдите или попросите администратора сбросить пароль.
                  details: null
        '410':
          $ref: '#/components/responses/InviteInvalid'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход по почте и паролю
      description: |
        Выдаёт ту же сессию, что остальные способы входа. Ответы различают причину:
        - `401 invalid_credentials` — неверная почта или пароль;
        - `403 access_request_pending` — заявка на рассмотрении; `403 access_request_rejected` — заявка отклонена;
        - `403 user_disabled` — доступ отключён;
        - `403 password_change_required` — вход с временным паролем от администратора: повторите запрос с `new_password`;
        - `429 too_many_requests` — 5 неудачных попыток подряд по этой почте, вход заблокирован на 5 минут.
        Про заявку и временный пароль сервер говорит, только если пароль верный.
      operationId: loginByEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLogin'
            examples:
              login:
                summary: Обычный вход
                value: {email: a.nurlanova@modus.example, password: korova-2026}
              temporary:
                summary: Вход с временным паролем и заменой
                value: {email: a.nurlanova@modus.example, password: Tmp-7kQ2-xZ9p, new_password: novyi-parol-2026}
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          description: Неверная почта или пароль (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: Неверная почта или пароль.
                  details: null
        '403':
          description: Заявка на рассмотрении или отклонена, доступ отключён, нужно сменить временный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pending:
                  value:
                    error:
                      code: access_request_pending
                      message: Заявка на рассмотрении. Войти можно после одобрения.
                      details: null
                rejected:
                  value:
                    error:
                      code: access_request_rejected
                      message: Заявка на доступ отклонена.
                      details: {reason: 'Подрядчикам доступ не выдаём'}
                disabled:
                  value:
                    error:
                      code: user_disabled
                      message: Доступ отключён. Обратитесь к администратору.
                      details: null
                change_password:
                  value:
                    error:
                      code: password_change_required
                      message: Это временный пароль. Задайте новый.
                      details: null
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Пять неудачных попыток подряд по этой почте (`too_many_requests`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: too_many_requests
                  message: Слишком много неудачных попыток. Попробуйте через 5 минут.
                  details: {retry_after_seconds: 300}
  /api/v1/auth/methods:
    get:
      tags: [auth]
      summary: Какие способы входа включены
      description: |
        Публичный маршрут для экрана входа. `bitrix24=false` — кнопку «Войти через Битрикс24» не показывать:
        на сервере не заданы `BITRIX24_CLIENT_ID`, `BITRIX24_CLIENT_SECRET` и `BITRIX24_PORTAL`.
      operationId: getAuthMethods
      security: []
      responses:
        '200':
          description: Способы входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
              example:
                bitrix24: true
  /api/v1/auth/bitrix/start:
    get:
      tags: [auth]
      summary: Начать вход через Битрикс24
      description: |
        Клиент открывает этот адрес обычным переходом браузера (не `fetch`). Сервер отвечает `302` на
        `https://<портал>/oauth/authorize/?client_id=…&state=…` и ставит cookie с `state`: он одноразовый,
        живёт 10 минут и привязан к браузеру. После входа портал возвращает пользователя на
        `GET /auth/bitrix/callback`. Вход через Битрикс24 не настроен — `404 not_found`.
      operationId: startBitrixLogin
      security: []
      responses:
        '302':
          description: Переход на страницу входа портала
          headers:
            Location:
              schema:
                type: string
              description: '`https://<портал>/oauth/authorize/?client_id=…&state=…`'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/bitrix/callback:
    get:
      tags: [auth]
      summary: Возврат с портала Битрикс24 (адрес возврата локального приложения)
      description: |
        Этот адрес указывается в настройках локального приложения на портале. Клиент его не вызывает.
        Сервер проверяет `state` (cookie, срок, одноразовость) и `domain`, меняет `code` на токен портала,
        узнаёт пользователя через `user.current` и сопоставляет его с сотрудником: по `bitrix_user_id`,
        затем по почте без учёта регистра (при совпадении запоминает `bitrix_user_id`). Токены портала не хранятся.

        Ответ всегда `302` на страницу клиента `<веб>/auth/bitrix/done`:
        - успех — `?code=<одноразовый код>`: клиент меняет его на сессию через `POST /auth/bitrix/exchange`.
          Токена сессии в адресной строке нет; код живёт 60 секунд;
        - отказ — `?error=<код ошибки>`: `access_request_pending` (незнакомому сотруднику создана заявка на доступ
          с именем и почтой из портала, либо она уже на рассмотрении), `access_request_rejected`, `user_disabled`,
          `invalid_bitrix_auth` (неверный или просроченный `state`, чужой портал, портал отклонил `code`),
          `bitrix_unavailable` (портал не ответил).
      operationId: bitrixLoginCallback
      security: []
      parameters:
        - name: code
          in: query
          description: Авторизационный код портала, живёт 30 секунд
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: domain
          in: query
          description: Домен портала
          schema:
            type: string
        - name: member_id
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Переход на `<веб>/auth/bitrix/done?code=…` или `?error=…`
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/bitrix/exchange:
    post:
      tags: [auth]
      summary: Обменять одноразовый код входа через Битрикс24 на сессию
      description: |
        Страница `<веб>/auth/bitrix/done` берёт `code` из адреса и получает ту же сессию, что у остальных способов входа.
        Код одноразовый и живёт 60 секунд; неверный, использованный или просроченный — `401 invalid_bitrix_auth`.
      operationId: exchangeBitrixLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 200
            example:
              code: 7Jq0mYw3n2c1VbXkT9sLrA
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          description: Код неверный, уже использован или истёк (`invalid_bitrix_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_bitrix_auth
                  message: Не удалось подтвердить вход через Битрикс24. Попробуйте ещё раз.
                  details: null
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/switch:
    post:
      tags: [auth]
      summary: Переключиться на связанный аккаунт (демо-переключатель ролей)
      description: |
        Выдаёт новую сессию от имени выбранного пользователя — с теми же правами, что при обычном входе под ним.
        Доступные пользователи — `Me.switch_targets`. Группа связанных аккаунтов задаётся настройкой вне
        репозитория; без неё список пуст, а маршрут отвечает `403`. Переключение пишется в журнал.
        Текущая сессия остаётся действующей: клиент заменяет токен на новый.
        Пользователь не из группы — `403 forbidden`; у выбранного отключён доступ — `403 user_disabled`.
        Только для сессии клиента: бот с сервисным ключом получает `403`.
      operationId: switchAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                  description: '`id` из `Me.switch_targets`'
            example:
              user_id: 3
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Пользователь не из группы связанных аккаунтов (`forbidden`) или у него отключён доступ (`user_disabled`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error:
                      code: forbidden
                      message: Переключиться на этого пользователя нельзя.
                      details: null
                disabled:
                  value:
                    error:
                      code: user_disabled
                      message: Доступ отключён. Обратитесь к администратору.
                      details: null
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------- access (заявки и приглашения)
  /api/v1/access-requests/departments:
    get:
      tags: [access]
      summary: Подразделения для формы заявки (без входа)
      description: Короткий список для выбора подразделения незнакомым аккаунтом. Сессия не нужна.
      operationId: listAccessDepartments
      security: []
      responses:
        '200':
          description: Подразделения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentRef'
              example:
                - {id: 1, name: Закупки}
                - {id: 2, name: Бухгалтерия}
                - {id: 3, name: Продажи}
                - {id: 6, name: IT}
  /api/v1/access-requests:
    post:
      tags: [access]
      summary: Подать или обновить заявку на доступ
      description: |
        Вызывает незнакомый системе Telegram-аккаунт. Кто он, бэкенд узнаёт одним из трёх способов:
        - **бот** — заголовки `X-Service-Key` и `X-Telegram-Id`, имя из профиля в `full_name`, ник в `telegram_username`;
        - **Mini App** — `init_data` (`Telegram.WebApp.initData` без изменений);
        - **веб** — `telegram_login`, поля колбэка Telegram Login как есть.

        Ровно один способ, иначе `401 unauthorized` (ни одного) или `422 validation_error` (оба поля сразу).
        У аккаунта одна заявка `pending`: повторная подача её обновляет (`200`), новая — `201`.
        После отказа можно подать новую. Уже заведённый пользователь — `409 already_registered`,
        отключённый — `403 user_disabled`. Не больше 5 подач с аккаунта в час — `429 too_many_requests`.
      operationId: submitAccessRequest
      security:
        - {}
        - serviceKey: []
          telegramId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestSubmit'
            examples:
              mini_app:
                summary: Mini App
                value:
                  init_data: 'query_id=AAH...&user=%7B%22id%22%3A100000021%7D&auth_date=1794300000&hash=3f2a...'
                  full_name: Сергей Ким
                  department_id: 3
                  comment: Менеджер по продажам, вышел 10 ноября
              web:
                summary: Веб, Telegram Login
                value:
                  telegram_login: {id: 100000021, first_name: Сергей, last_name: Ким, username: sergey_kim, auth_date: 1794300000, hash: 9b1c0e7d4a...}
                  full_name: Сергей Ким
                  department_id: 3
                  comment: Менеджер по продажам
              bot:
                summary: Бот (заголовки X-Service-Key и X-Telegram-Id)
                value:
                  full_name: Сергей Ким
                  telegram_username: sergey_kim
                  department_id: 3
                  comment: null
      responses:
        '200':
          description: Заявка на рассмотрении обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
              examples:
                AccessRequestPending:
                  $ref: '#/components/examples/AccessRequestPending'
        '201':
          description: Заявка подана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
              examples:
                AccessRequestPending:
                  $ref: '#/components/examples/AccessRequestPending'
        '401':
          description: Нет данных Telegram (`unauthorized`) или подпись не прошла проверку (`invalid_telegram_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_telegram_auth
                  message: Не удалось подтвердить вход через Telegram.
                  details: null
        '403':
          $ref: '#/components/responses/UserDisabled'
        '409':
          $ref: '#/components/responses/AlreadyRegistered'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/access-requests/mine:
    post:
      tags: [access]
      summary: Состояние доступа и своей заявки
      description: |
        Что показать незнакомому аккаунту: форму заявки, «на рассмотрении», отказ с причиной или вход.
        Опознание такое же, как при подаче: бот — заголовки и пустое тело `{}`, Mini App — `init_data`, веб — `telegram_login`.
        `request` — последняя заявка аккаунта или `null`.
      operationId: getMyAccessRequest
      security:
        - {}
        - serviceKey: []
          telegramId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramIdentity'
            example:
              init_data: 'query_id=AAH...&user=%7B%22id%22%3A100000021%7D&auth_date=1794300000&hash=3f2a...'
      responses:
        '200':
          description: Состояние доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessStatus'
              examples:
                pending:
                  summary: Заявка на рассмотрении
                  value:
                    state: pending
                    request: {id: 7, status: pending, full_name: Сергей Ким, email: null, telegram_username: sergey_kim, department: {id: 3, name: Продажи}, comment: 'Менеджер по продажам, вышел 10 ноября', created_at: '2026-11-11T09:12:00+05:00', updated_at: '2026-11-11T09:12:00+05:00', assigned_role: null, assigned_department: null, decided_by: null, decided_at: null, reject_reason: null, user_id: null}
                none:
                  summary: Заявки нет — показать форму
                  value:
                    state: none
                    request: null
                rejected:
                  summary: Отказ
                  value:
                    state: rejected
                    request: {id: 5, status: rejected, full_name: Олег Петров, email: null, telegram_username: null, department: {id: 6, name: IT}, comment: Подрядчик, created_at: '2026-11-10T15:00:00+05:00', updated_at: '2026-11-10T16:20:00+05:00', assigned_role: null, assigned_department: null, decided_by: {id: 2, full_name: Анна Ли, role: admin, department: null}, decided_at: '2026-11-10T16:20:00+05:00', reject_reason: 'Подрядчикам доступ не выдаём, обратитесь к руководителю проекта', user_id: null}
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [access]
      summary: Что за приглашение (без входа)
      description: |
        Для страницы `/invite/<токен>` в вебе до входа. Недействительное — `410 invite_invalid`.
        Больше 10 недействительных токенов с одного адреса за 15 минут — `429 too_many_requests` (защита от перебора).
      operationId: getInvitePreview
      security: []
      responses:
        '200':
          description: Приглашение действует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
              example:
                role: employee
                department: {id: 3, name: Продажи}
                full_name: Сергей Ким
                expires_at: '2026-11-18T10:00:00+05:00'
        '410':
          $ref: '#/components/responses/InviteInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invites/accept:
    post:
      tags: [access]
      summary: Принять приглашение
      description: |
        Опознание как у заявки: бот (`/start inv_<токен>`) — заголовки `X-Service-Key` и `X-Telegram-Id`,
        Mini App — `init_data`, веб (`/invite/<токен>`) — `telegram_login`.

        - Незнакомый аккаунт и действующее приглашение — пользователь создаётся с ролью и подразделением
          из приглашения, `created=true`. Имя: из приглашения, иначе `full_name`, иначе из профиля Telegram.
        - Уже заведённый пользователь — ничего не меняется, `created=false`, приглашение не расходуется.
        - Отключённый — `403 user_disabled`.
        - Просроченное, отозванное или исчерпанное приглашение — `410 invite_invalid` (предложить заявку).
        - Больше 10 недействительных токенов за 15 минут с одного адреса (у бота — с одного Telegram ID) — `429 too_many_requests`.

        `session` — сессия для Mini App и веба (как у `/auth/*`). Боту сессия не нужна, ему `session=null`.
      operationId: acceptInvite
      security:
        - {}
        - serviceKey: []
          telegramId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAccept'
            examples:
              web:
                summary: Веб, Telegram Login
                value:
                  token: Qm9sZC1pbnZpdGUtdG9rZW4tZXhhbXBsZQ
                  telegram_login: {id: 100000021, first_name: Сергей, last_name: Ким, username: sergey_kim, auth_date: 1794300000, hash: 9b1c0e7d4a...}
              bot:
                summary: Бот (заголовки X-Service-Key и X-Telegram-Id)
                value:
                  token: Qm9sZC1pbnZpdGUtdG9rZW4tZXhhbXBsZQ
                  full_name: Сергей Ким
                  telegram_username: sergey_kim
      responses:
        '200':
          description: Доступ есть
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAccepted'
              examples:
                web:
                  summary: Пользователь создан, веб получил сессию
                  value:
                    created: true
                    user: {id: 21, telegram_id: 100000021, email: null, has_password: false, telegram_linked: true, switch_targets: [], full_name: Сергей Ким, position: null, role: employee, department: {id: 3, name: Продажи}, is_absent: false, is_disabled: false, responsible_for: [], deputy_for: [], assigned_open_count: 0, permissions: {can_create_appeal: true, can_process_appeals: false, can_view_department: false, can_view_all_appeals: false, analytics_scope: none, can_upload_meetings: false, can_manage_settings: false, can_view_unassigned: false, can_manage_access: false}}
                    session:
                      access_token: eyJhbGciOiJIUzI1NiJ9.mock.session
                      token_type: bearer
                      expires_at: '2026-12-11T10:00:00+05:00'
                bot:
                  summary: Пользователь создан, бот — без сессии
                  value:
                    created: true
                    user: {id: 21, telegram_id: 100000021, email: null, has_password: false, telegram_linked: true, switch_targets: [], full_name: Сергей Ким, position: null, role: employee, department: {id: 3, name: Продажи}, is_absent: false, is_disabled: false, responsible_for: [], deputy_for: [], assigned_open_count: 0, permissions: {can_create_appeal: true, can_process_appeals: false, can_view_department: false, can_view_all_appeals: false, analytics_scope: none, can_upload_meetings: false, can_manage_settings: false, can_view_unassigned: false, can_manage_access: false}}
                    session: null
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '410':
          $ref: '#/components/responses/InviteInvalid'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      summary: Кто я
      description: |
        Роль, подразделение, назначения ответственным и права для навигации.
        Бот вызывает с `X-Service-Key` и `X-Telegram-Id`, чтобы опознать пользователя:
        незаведённый получает `403 user_not_registered`, отключённый — `403 user_disabled`.
      operationId: getMe
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeEmployee'
                owner:
                  $ref: '#/components/examples/MeOwner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LoginForbidden'
  /api/v1/me/credentials:
    put:
      tags: [me]
      summary: Задать или сменить почту и пароль
      description: |
        Пользователь, пришедший через Telegram, задаёт почту и пароль (`email` и `new_password` обязательны).
        У кого пароль уже есть, указывает `current_password`; можно сменить почту, пароль или оба.
        Неверный текущий пароль — `422` с полем `current_password`. Почта у другого сотрудника — `409 email_taken`.
      operationId: updateMyCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsUpdate'
            examples:
              set:
                summary: Первый раз (пришёл через Telegram)
                value: {email: a.nurlanova@modus.example, new_password: korova-2026}
              change:
                summary: Смена пароля
                value: {current_password: korova-2026, new_password: novyi-parol-2026}
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeEmployee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Почта уже у другого сотрудника (`email_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: email_taken
                  message: Эта почта уже у другого сотрудника.
                  details: null
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/telegram:
    post:
      tags: [me]
      summary: Привязать Telegram к аккаунту
      description: |
        Тело — поля Telegram Login без изменений, проверяются так же, как при входе виджетом.
        Потом пользователь входит через Telegram и получает уведомления бота.
        Telegram у другого сотрудника — `409 telegram_taken`.
      operationId: linkTelegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWidgetLoginRequest'
            example:
              id: 100000004
              first_name: Айгерим
              last_name: Нурланова
              username: aigerim_demo
              auth_date: 1794300000
              hash: 9b1c0e7d4a...
      responses:
        '200':
          description: Текущий пользователь с привязанным Telegram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeEmployee'
        '401':
          $ref: '#/components/responses/InvalidTelegramAuth'
        '409':
          description: Этот Telegram уже у другого сотрудника (`telegram_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: telegram_taken
                  message: Этот Telegram уже привязан к другому сотруднику.
                  details: null
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [me]
      summary: Отвязать Telegram
      description: Можно, только если у аккаунта есть почта и пароль, иначе `409 last_login_method`. Уведомления бота перестают приходить.
      operationId: unlinkTelegram
      responses:
        '200':
          description: Текущий пользователь без Telegram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeEmployee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Это единственный способ входа (`last_login_method`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: last_login_method
                  message: Сначала задайте почту и пароль — иначе вы не сможете войти.
                  details: null

  /api/v1/dictionaries:
    get:
      tags: [dictionaries]
