      responses:
        '201':
          description: Подразделение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              example:
                id: 9
                name: Логистика
                head: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/departments/{department_id}:
    parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Изменить название или руководителя подразделения
      description: Только администратор, остальным — `403`.
      operationId: adminUpdateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
            example:
              head_id: 3
      responses:
        '200':
          description: Подразделение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              example:
                id: 1
                name: Закупки
                head: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/categories:
    post:
      tags: [admin]
      summary: Добавить категорию
      description: Только администратор, остальным — `403`.
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
            example:
              name: Склад и логистика
              department_id: 1
              responsible_id: 3
              deputy_id: 4
      responses:
        '201':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 19
                name: Склад и логистика
                department: {id: 1, name: Закупки}
                responsible: {id: 3, full_name: Марат Сейткали, role: head, department: {id: 1, name: Закупки}}
                deputy: {id: 4, full_name: Айгерим Нурланова, role: employee, department: {id: 1, name: Закупки}}
                is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: 'Изменить категорию: ответственный, заместитель, подразделение, активность'
      description: |
        Изменение влияет на маршрутизацию новых обращений; уже назначенные не переназначаются.
        Только администратор, остальным — `403`.
      operationId: adminUpdateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              responsible_id: 13
              deputy_id: null
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 7
                name: Интеграции и IT
                department: {id: 6, name: IT}
                responsible: {id: 13, full_name: Даурен Исаев, role: employee, department: {id: 6, name: IT}}
                deputy: null
                is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [admin]
      summary: Удалить категорию, в которой нет обращений
      description: |
        Удаляется только категория без обращений (в любом статусе). Если обращения есть — `409 conflict`,
        `details.reason = category_has_appeals` и `details.appeals_count`: такую категорию можно только
        выключить (`PATCH` с `is_active: false`). Черновики совещаний с этой категорией остаются без категории.
        Только администратор, остальным — `403`.
      operationId: adminDeleteCategory
      responses:
        '204':
          description: Категория удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: В категории есть обращения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: В этой категории есть обращения, удалить её нельзя. Выключите категорию — новые обращения в неё не попадут.
                  details: {reason: category_has_appeals, appeals_count: 3}
