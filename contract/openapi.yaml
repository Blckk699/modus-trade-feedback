              example:
                - {"id": 7, "appeal_id": 1, "filename": "пример_заявки.pdf", "content_type": "application/pdf", "size_bytes": 184320, "download_url": "/api/v1/attachments/7", "preview_url": null, "can_delete": true, "uploaded_by": {"id": 4, "full_name": "Айгерим Нурланова", "role": "employee", "department": {"id": 1, "name": "Закупки"}}, "created_at": "2026-11-04T10:21:00+05:00"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [attachments]
      summary: Приложить файл
      description: Автор, ответственный, руководитель подразделения обращения и собственник, пока обращение не завершено. Не больше 20 МБ на файл.
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл сохранён
          content:
